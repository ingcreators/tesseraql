name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify on Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    # One JVM, because the framework owns the process it runs in (docs/jvm-baseline.md
    # decision 3). The matrix stays so a future LTS can be checked alongside the baseline
    # without renaming the check this branch requires.
    strategy:
      fail-fast: false
      matrix:
        java:
          - '25'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

  # Windows Server is a released production target (docs/runtime-footprint.md decision 2a):
  # jpackage builds and release.yml attaches a Windows artifact, so the modules where platform
  # semantics actually live run on the platform they are released for. Not the Testcontainers
  # suite — it is slow and flaky on Windows agents and exercises a database, not a filesystem —
  # just tesseraql-operations (install/upgrade/catalog: held-file and path semantics) and
  # tesseraql-cli (paths, launchers, watch), which between them have exactly two Testcontainers
  # classes to exclude. EmbeddedDbDevIntegrationTest resolves the windows-amd64 binary over the
  # network (the one network fetch this job pays for) and boots a real postgres, asserting the
  # server is the configured major — the measurement that answers which binary is live on
  # Windows, permanent instead of logged once.
  windows-tests:
    name: Platform tests on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Two invocations so upstream reactor modules build without running their suites here:
      # -am with the test goal would run every upstream module's tests on this runner too.
      - name: Build the platform-semantics modules and their dependencies
        shell: bash
        run: ./mvnw -B -ntp -DskipTests -pl tesseraql-operations,tesseraql-cli -am install

      - name: Run the suites (Testcontainers classes excluded)
        shell: bash
        run: |
          ./mvnw -B -ntp -pl tesseraql-operations,tesseraql-cli test \
            -Dtest='!AppLifecycleDbCommandsIntegrationTest,!JobCommandIntegrationTest'

  dist:
    name: CLI distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the CLI distribution
        run: ./mvnw -B -ntp -pl tesseraql-cli -am -Pdist -DskipTests package

      - name: Smoke-test the fat jar
        run: java -jar tesseraql-cli/target/tesseraql-cli-*-all.jar routes --app examples/scaffold-demo-app

      # The dist-only failure class (a stale or missing class, a dropped driver, a
      # service file lost in the fat-jar merge) is invisible to in-JVM tests: prove
      # the shipped archive actually lints, clears admission, and RUNS a gallery
      # app end to end — through the dev gateway, at the app's /<name>/ address,
      # exactly the shape a developer runs (docs/cli-surface.md decision 4).
      - name: Run a gallery app from the dist archive
        run: |
          tar xzf tesseraql-cli/target/tesseraql-cli-*-dist.tar.gz -C "$RUNNER_TEMP"
          TQL=$(echo "$RUNNER_TEMP"/tesseraql-*/bin/tesseraql)
          # The distribution carries no module bag (docs/module-channel.md decision 4): opt-in
          # codecs reach an application through its own tesseraql.modules, never through a
          # directory shipped beside the launcher that would give development a codec the
          # deployment does not have.
          if [ -d "$(dirname "$TQL")/../modules" ]; then
            echo 'The dist archive carries a modules/ directory; it must not.'
            ls -la "$(dirname "$TQL")/../modules"; exit 1
          fi
          "$TQL" lint --app examples/inventory-app
          "$TQL" admission --app examples/inventory-app
          # The documented operator step for the app's analytics engine (docs/duckdb.md):
          # provision the offline extension cache before first boot.
          "$TQL" duckdb install-extensions --app examples/inventory-app
          "$TQL" dev --stack examples --app-name inventory --embedded-db > dev.log 2>&1 &
          DEV_PID=$!
          READY=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/inventory/_tesseraql/health/ready > /dev/null; then READY=1; break; fi
            kill -0 "$DEV_PID" 2>/dev/null || break
            sleep 2
          done
          if [ "$READY" != "1" ]; then echo '--- dev.log ---'; cat dev.log; exit 1; fi
          curl -sf http://localhost:8080/inventory/_tesseraql/health/live > /dev/null
          # The stop path is part of the contract (docs/runtime-replace.md, the stack's own
          # stop): SIGTERM must reach the gateway's ordered drain, not hard-kill the JVM.
          # JUnit can only test close(); observing the drain log line here is what proves the
          # signal path end to end.
          kill "$DEV_PID"
          wait "$DEV_PID" || true
          if ! grep -q "Stack stopping" dev.log; then
            echo 'SIGTERM did not reach the ordered drain (no "Stack stopping" line):'
            echo '--- dev.log ---'; cat dev.log; exit 1
          fi

  # The default shipping pattern in docs/deployment.md is a baked image, and nothing built
  # deploy/Dockerfile: it had been unbuildable since the copy-dependencies step started
  # needing the reactor installed, and the failure was invisible because the demo image
  # (built only on release tags) had already been fixed. This job builds the documented
  # image and runs the CLI inside it, so the deployment path breaks in a pull request
  # rather than in someone's deploy.
  deploy-image:
    name: Deployment image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the baked image
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg APP_HOME=examples/scaffold-demo-app \
            -t tesseraql-deploy-check .

      - name: Run the CLI inside the image
        run: |
          # No database is involved: this proves the image's classpath resolves and the app
          # compiles, which is what the unbuildable image would have hidden.
          #
          # The output is asserted, not just the exit code — the same reasoning as the
          # jpackage smoke test: a launcher that starts, prints nothing and exits 0 passes
          # an exit-code-only check while being useless.
          out=$(docker run --rm tesseraql-deploy-check routes --app /stack/app)
          printf '%s\n' "$out"
          grep -q 'items.search' <<<"$out" \
            || { echo "the image listed no routes" >&2; exit 1; }

      - name: Assert the shared archive was trained into the image
        run: |
          docker run --rm --entrypoint sh tesseraql-deploy-check \
            -c 'test -s /opt/tesseraql/lib/cds.jsa'
          # An archive the running JVM refuses (a flag mismatch between the training run and
          # the entrypoint) is worse than none: it costs four error lines per start and buys
          # nothing. Assert the CDS logger stays quiet.
          noise=$(docker run --rm tesseraql-deploy-check routes --app /stack/app 2>&1 >/dev/null \
                  | grep -c '\[cds\]' || true)
          [ "${noise:-0}" = "0" ] || {
            docker run --rm tesseraql-deploy-check routes --app /stack/app 2>&1 >/dev/null
            echo "the shared archive was refused at run time" >&2; exit 1; }

  # The documentation site (docs/docs-site.md): the same build command Cloudflare
  # Workers Builds runs, so green CI implies a clean deploy. This is also where the
  # sync's completeness guard and the links validator gate PRs: a new docs/*.md that
  # is neither mapped nor excluded, or a broken internal link, fails here.
  docs-site:
    name: Docs site (Astro)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: docs-site/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Build the site (sync, completeness guard, links validation)
        working-directory: docs-site
        run: pnpm run build

  # The VS Code extension (docs/vscode-extension.md): typecheck, the node:test suite
  # over the editor-free core, and a vsce package smoke so a broken manifest can
  # never merge.
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: vscode-extension/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vscode-extension/pnpm-lock.yaml

      - name: Install
        working-directory: vscode-extension
        run: pnpm install --frozen-lockfile

      - name: Build and test
        working-directory: vscode-extension
        run: pnpm run test

      - name: Package smoke
        working-directory: vscode-extension
        run: pnpm run package
