name: jpackage

# Builds the CLI as a jpackage app image (a platform launcher with a bundled JVM) on each OS.
# jpackage keeps the dynamic classpath the runtime needs (ServiceLoader codecs/drivers, the
# --modules child classloader, signed plugins/) — unlike a closed-world native image. Runs on CLI
# changes (validation) and on release tags / manual dispatch (artifacts).

on:
  pull_request:
    paths:
      - 'tesseraql-cli/**'
      - 'tesseraql-host/**'
      - 'deploy/windows/**'
      - '.github/workflows/jpackage.yml'
      - 'pom.xml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# contents:write so the tag build can attach its app-image archive to the GitHub release; only the
# tag-gated "Attach" step writes (PR/dispatch builds just validate and upload a CI artifact).
permissions:
  contents: write

jobs:
  jpackage:
    name: Native image on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the fat jar
        run: ./mvnw -B -ntp -pl tesseraql-cli -am -Pdist -DskipTests package

      - name: Build the app image
        shell: bash
        run: |
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          APPVER=${VERSION%-SNAPSHOT}
          # jpackage (macOS) rejects a zero major version; pre-1.0 dev builds use a 1.0.0 bundle
          # placeholder. The authoritative version stays in the jar manifest (tesseraql --version).
          case "$APPVER" in 0.*) APPVER=1.0.0 ;; esac
          mkdir -p build/jpackage-input
          cp tesseraql-cli/target/tesseraql-cli-*-all.jar build/jpackage-input/tesseraql.jar
          # On Windows, build a console-subsystem launcher (--win-console) so the CLI's stdout/stderr
          # reach the terminal. Without it jpackage produces a GUI-subsystem tesseraql.exe that runs
          # but prints nothing when invoked from cmd/PowerShell — the tool looks unresponsive. The
          # flag is Windows-only (jpackage rejects it on Linux/macOS), so add it conditionally.
          console=()
          [ "$RUNNER_OS" = "Windows" ] && console=(--win-console)
          # The JVM defaults the launchers apply (docs/jvm-baseline.md decision 4), plus the
          # class-data-sharing setup this channel needs. jlink's runtime ships without a base
          # CDS archive, and without one the JVM silently declines to build an application
          # archive at all — so --generate-cds-archive creates it here. That also means
          # --strip-native-commands has to go: generating the archive runs the runtime's own
          # bin/java (228 KB, which stays).
          #
          # $APPDIR is substituted by the jpackage launcher at run time, so the application
          # archive is written and validated against the installed path. It cannot be built
          # here: an archive records the classpath it saw, and this build path is not where
          # the application ends up.
          jpackage --type app-image --name tesseraql \
            --input build/jpackage-input --main-jar tesseraql.jar \
            --main-class io.tesseraql.cli.TesseraqlCli \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --generate-cds-archive" \
            --java-options -XX:+UseCompactObjectHeaders \
            --java-options --sun-misc-unsafe-memory-access=allow \
            --java-options -XX:+AutoCreateSharedArchive \
            --java-options '-XX:SharedArchiveFile=$APPDIR/app-cds.jsa' \
            --java-options -Xlog:cds=error:stderr \
            --add-modules java.se,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.localedata,jdk.unsupported,jdk.management,jdk.naming.dns,jdk.zipfs,jdk.httpserver,jdk.net,jdk.security.auth \
            --app-version "$APPVER" \
            "${console[@]}" \
            --dest build/jpackage

      - name: Give the runtime a compact-object-headers base archive
        shell: bash
        run: |
          # jlink generates classes.jsa, and the launchers run with compact object headers, for
          # which the JVM looks for classes_coh.jsa instead. Without this step the generated
          # archive is the wrong layout and is never used. Dumping it needs the runtime's own
          # java, which is why the jlink step keeps bin/.
          JAVA=$(find build/jpackage -type f -path '*bin*' \( -name java -o -name java.exe \) | head -1)
          "$JAVA" -XX:+UseCompactObjectHeaders -Xshare:dump
          # Only the compact-object-headers archive is ever mapped, and each is ~15 MB of
          # download: drop the layouts this launcher cannot use.
          find build/jpackage \( -name classes.jsa -o -name classes_nocoops.jsa \) -delete
          find build/jpackage -name '*.jsa' -exec ls -l {} +

      - name: Smoke-test the native launcher
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) LAUNCHER=build/jpackage/tesseraql/bin/tesseraql ;;
            macOS) LAUNCHER=build/jpackage/tesseraql.app/Contents/MacOS/tesseraql ;;
            Windows) LAUNCHER=build/jpackage/tesseraql/tesseraql.exe ;;
          esac
          # Assert the launcher actually writes to stdout: a Windows GUI-subsystem launcher (built
          # without --win-console) runs and exits 0 but prints nothing, so an exit-code-only check
          # would miss it. Capturing and grepping the output guards that regression.
          out=$("$LAUNCHER" routes --app examples/scaffold-demo-app)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '[^[:space:]]' \
            || { echo "launcher produced no stdout (Windows console subsystem?)" >&2; exit 1; }

      - name: Upload the app image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tesseraql-${{ matrix.os }}
          path: build/jpackage
          if-no-files-found: error

      # Phase 38 Tier 1: ship the JRE-free app-image as a stable Release download (not just a
      # time-limited CI artifact). tar.gz for Linux/macOS, zip for Windows; named by real version
      # (the jar manifest version, not the jpackage 1.0.0 placeholder) and runner arch. Runs on PRs
      # too (the result is only attached on tags) so the archiving is validated before a real release.
      - name: Archive the app image
        shell: bash
        run: |
          ROOT="$PWD"
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          VERSION=${VERSION%-SNAPSHOT}
          ARCH=$(uname -m)
          case "$RUNNER_OS" in
            Linux)
              ASSET="tesseraql-${VERSION}-linux-${ARCH}.tar.gz"
              tar -C build/jpackage -czf "$ASSET" tesseraql ;;
            macOS)
              ASSET="tesseraql-${VERSION}-macos-${ARCH}.tar.gz"
              tar -C build/jpackage -czf "$ASSET" tesseraql.app ;;
            Windows)
              ASSET="tesseraql-${VERSION}-windows-${ARCH}.zip"
              ( cd build/jpackage && 7z a -tzip "$ROOT/$ASSET" tesseraql > /dev/null ) ;;
          esac
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Attach the app image to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # release.yml publishes the release near the END of its run (verify + deploy first), so
          # this per-OS job will usually finish first — poll until the release exists, then attach.
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$ASSET" --clobber
              echo "Attached $ASSET to $TAG"
              exit 0
            fi
            echo "Waiting for release $TAG ($i/60)..."
            sleep 20
          done
          echo "Release $TAG did not appear within the timeout" >&2
          exit 1

  # The Windows Server deployment artifact (docs/runtime-footprint.md decision 2a): the
  # tesseraql-host distribution as a jpackage app image, plus the WinSW service definition it is
  # supervised with. Windows only — a Linux deployment is the container image
  # (deploy/Dockerfile), which the deploy-image CI job already proves. Beyond building it, this
  # job installs the image as a real Windows service against a real PostgreSQL and asserts the
  # stop path: a service stop must reach the JVM shutdown hook's ordered drain ("Stack
  # stopping"), the same contract SIGTERM has in the container.
  host-image:
    name: Host image on windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the host fat jar
        shell: bash
        run: ./mvnw -B -ntp -pl tesseraql-host -am -Pdist -DskipTests package

      - name: Build the host app image
        shell: bash
        run: |
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          APPVER=${VERSION%-SNAPSHOT}
          # jpackage rejects a zero major version; pre-1.0 dev builds use a 1.0.0 bundle
          # placeholder — the authoritative version stays in the jar manifest.
          case "$APPVER" in 0.*) APPVER=1.0.0 ;; esac
          mkdir -p build/jpackage-input
          cp tesseraql-host/target/tesseraql-host-*-all.jar build/jpackage-input/tesseraql-host.jar
          # --win-console for the same reason the CLI image carries it — and here the service
          # wrapper captures the console streams as the service log, so a silent GUI-subsystem
          # launcher would produce an unsupervised service with an empty log.
          jpackage --type app-image --name tesseraql-host \
            --input build/jpackage-input --main-jar tesseraql-host.jar \
            --main-class io.tesseraql.cli.TesseraqlHostCli \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --generate-cds-archive" \
            --java-options -XX:+UseCompactObjectHeaders \
            --java-options --sun-misc-unsafe-memory-access=allow \
            --java-options -XX:+AutoCreateSharedArchive \
            --java-options '-XX:SharedArchiveFile=$APPDIR/app-cds.jsa' \
            --java-options -Xlog:cds=error:stderr \
            --add-modules java.se,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.localedata,jdk.unsupported,jdk.management,jdk.naming.dns,jdk.zipfs,jdk.httpserver,jdk.net,jdk.security.auth \
            --app-version "$APPVER" \
            --win-console \
            --dest build/jpackage

      - name: Give the runtime a compact-object-headers base archive
        shell: bash
        run: |
          # Same reasoning as the CLI image: the launchers run with compact object headers, for
          # which the JVM maps classes_coh.jsa; the jlink-generated layouts are dropped.
          JAVA=$(find build/jpackage -type f -path '*bin*' -name java.exe | head -1)
          "$JAVA" -XX:+UseCompactObjectHeaders -Xshare:dump
          find build/jpackage \( -name classes.jsa -o -name classes_nocoops.jsa \) -delete

      - name: Smoke-test the launcher
        shell: bash
        run: |
          out=$(build/jpackage/tesseraql-host/tesseraql-host.exe routes --app examples/scaffold-demo-app)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'items.search' \
            || { echo "the host launcher listed no routes" >&2; exit 1; }

      # docs/module-channel.md decision 6: a framework database that is not PostgreSQL needs its
      # driver on the base classpath, which no application's module channel can reach. The app
      # image's route is app\ext\ plus one app.classpath line in the generated .cfg — the one
      # placement mechanism this distribution has, asserted here rather than assumed, in both
      # directions: refused without the jar, past that refusal with it.
      - name: Assert the base-classpath extension route (framework driver on the app image)
        shell: pwsh
        run: |
          $stack = Join-Path $env:RUNNER_TEMP 'driver-stack'
          New-Item -ItemType Directory -Force -Path (Join-Path $stack 'demo') | Out-Null
          Copy-Item -Recurse -Force 'examples\scaffold-demo-app\*' (Join-Path $stack 'demo')
          # A here-string cannot be indented inside a YAML block scalar, so the file is written
          # line by line — the stack declares a SQL Server framework datasource and the coordinate
          # of the driver it needs.
          $lines = @(
            'framework:',
            '  datasource:',
            '    jdbcUrl: "jdbc:sqlserver://127.0.0.1:1433;databaseName=stack;loginTimeout=1"',
            '    username: sa',
            '    password: unused',
            '    modules:',
            '      - com.microsoft.sqlserver:mssql-jdbc'
          )
          Set-Content -Encoding utf8 -Path (Join-Path $stack 'tesseraql-stack.yml') -Value $lines

          $exe = 'build\jpackage\tesseraql-host\tesseraql-host.exe'
          $before = & $exe host --stack $stack --port 18443 2>&1 | Out-String
          Write-Host $before
          if ($before -notmatch 'TQL-APP-4220') {
            Write-Error 'a missing framework driver did not raise TQL-APP-4220'
            exit 1
          }

          # Place the driver the way an operator does: the jar beside the image, one classpath line.
          $app = 'build\jpackage\tesseraql-host\app'
          New-Item -ItemType Directory -Force -Path (Join-Path $app 'ext') | Out-Null
          $version = (Select-String -Path pom.xml -Pattern '<mssql-jdbc.version>(.*)</mssql-jdbc.version>').Matches[0].Groups[1].Value
          & ./mvnw.cmd -B -ntp -q dependency:get "-Dartifact=com.microsoft.sqlserver:mssql-jdbc:$version"
          $jar = Get-ChildItem -Recurse -Filter 'mssql-jdbc-*.jar' "$env:USERPROFILE\.m2\repository\com\microsoft" |
            Where-Object { $_.Name -notmatch 'sources|javadoc' } | Select-Object -First 1
          if (-not $jar) { Write-Error 'no mssql-jdbc jar in the local repository'; exit 1 }
          Copy-Item $jar.FullName (Join-Path $app 'ext')
          # The entry belongs beside the existing app.classpath line, inside [Application]:
          # appending to the end of the file lands it in [JavaOptions], where the launcher reads it
          # as a JVM option and the classpath never grows. Insert, do not append.
          $cfgPath = Join-Path $app 'tesseraql-host.cfg'
          $cfg = [System.Collections.Generic.List[string]](Get-Content $cfgPath)
          $last = ($cfg | Select-String -Pattern '^app\.classpath=' | Select-Object -Last 1).LineNumber
          if (-not $last) { Write-Error 'the app image cfg has no app.classpath line'; exit 1 }
          $cfg.Insert($last, "app.classpath=`$APPDIR\ext\$($jar.Name)")
          Set-Content -Path $cfgPath -Value $cfg
          Write-Host '--- tesseraql-host.cfg ---'
          Get-Content $cfgPath | Write-Host

          $after = & $exe host --stack $stack --port 18443 2>&1 | Out-String
          Write-Host $after
          if ($after -match 'TQL-APP-4220') {
            Write-Error 'the placed driver did not reach the base classpath'
            exit 1
          }
          # Both runs are expected to exit non-zero — that is the point: the host refuses, first
          # for the missing driver and then because no SQL Server is listening. The step's verdict
          # is the two assertions above, so the last native exit code must not become it.
          exit 0

      - name: Start the runner's PostgreSQL and create the demo database
        shell: pwsh
        run: |
          # The windows-latest image ships PostgreSQL preinstalled with its service stopped
          # (user postgres, password root, $env:PGBIN published by the image).
          $svc = Get-Service -Name postgresql*
          Set-Service -InputObject $svc -Status running -StartupType manual
          & "$env:PGBIN\createdb.exe" -U postgres scaffold_demo
        env:
          PGPASSWORD: root

      - name: Install the host as a Windows service (WinSW) and assert the ordered drain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $svcDir = "$env:RUNNER_TEMP\tesseraql-host-svc"
          $stack = "$env:RUNNER_TEMP\stack"
          New-Item -ItemType Directory -Force -Path $svcDir, $stack | Out-Null
          Copy-Item -Recurse examples/scaffold-demo-app "$stack\scaffold-demo"

          # WinSW 2.12.0, pinned by checksum: the wrapper is part of the documented supervision
          # story (deploy/windows/tesseraql-host-service.xml), so the drain is proven through the
          # exact stop path an operator uses.
          $winsw = "$svcDir\tesseraql-host-service.exe"
          Invoke-WebRequest -Uri 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe' -OutFile $winsw
          $hash = (Get-FileHash -Algorithm SHA256 $winsw).Hash.ToLowerInvariant()
          if ($hash -ne '05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da') {
            throw "WinSW checksum mismatch: $hash"
          }

          $exe = (Resolve-Path 'build/jpackage/tesseraql-host/tesseraql-host.exe').Path
          @"
          <service>
            <id>tesseraql-host</id>
            <name>TesseraQL Host (CI)</name>
            <description>Drain assertion for the Windows Server execution story.</description>
            <executable>$exe</executable>
            <arguments>host --stack $stack --port 18080</arguments>
            <env name="DB_USER" value="postgres"/>
            <env name="DB_PASSWORD" value="root"/>
            <stoptimeout>60 sec</stoptimeout>
            <logpath>$svcDir\logs</logpath>
            <log mode="append"/>
          </service>
          "@ | Set-Content "$svcDir\tesseraql-host-service.xml"

          & $winsw install
          & $winsw start
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              Invoke-WebRequest -Uri 'http://localhost:18080/_tesseraql/health/live' -UseBasicParsing | Out-Null
              $ready = $true; break
            } catch { Start-Sleep -Seconds 2 }
          }
          function Dump-ServiceLogs {
            Get-ChildItem "$svcDir\logs" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name) ---"
              Get-Content $_.FullName
            }
          }
          if (-not $ready) {
            Dump-ServiceLogs
            throw 'the hosted stack never answered /_tesseraql/health/live'
          }

          # The assertion this job exists for: a service stop reaches the ordered drain. stopwait
          # (not stop) blocks until the SCM reports the service stopped, i.e. after the drain;
          # the drain line lands in the stderr log, where the structured log provider writes.
          & $winsw stopwait
          $drained = $false
          for ($i = 0; $i -lt 15; $i++) {
            $hits = Get-ChildItem "$svcDir\logs" -Filter *.log -ErrorAction SilentlyContinue |
              Select-String -Pattern 'Stack stopping'
            if (($hits | Measure-Object).Count -gt 0) { $drained = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $drained) {
            Dump-ServiceLogs
            throw 'the service stop did not reach the ordered drain (no "Stack stopping" line)'
          }
          & $winsw uninstall

      - name: Archive the host image
        shell: bash
        run: |
          ROOT="$PWD"
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          VERSION=${VERSION%-SNAPSHOT}
          ARCH=$(uname -m)
          ASSET="tesseraql-host-${VERSION}-windows-${ARCH}.zip"
          cp deploy/windows/tesseraql-host-service.xml build/jpackage/
          ( cd build/jpackage && 7z a -tzip "$ROOT/$ASSET" tesseraql-host tesseraql-host-service.xml > /dev/null )
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload the host image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tesseraql-host-windows
          path: build/jpackage
          if-no-files-found: error

      - name: Attach the host image to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$ASSET" --clobber
              echo "Attached $ASSET to $TAG"
              exit 0
            fi
            echo "Waiting for release $TAG ($i/60)..."
            sleep 20
          done
          echo "Release $TAG did not appear within the timeout" >&2
          exit 1
