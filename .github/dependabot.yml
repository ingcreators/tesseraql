version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Plugin patch/minor bumps land together; library and major bumps stay individual.
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
        update-types:
          - minor
          - patch
    ignore:
      # DuckDB 1.5 is a DuckLake semantics migration wearing a version bump: writes of up to
      # ten rows are inlined into the catalog until flushed, and reclaiming files needs a
      # rewrite step that expire-then-cleanup no longer implies. docs/ducklake-1.5.md records
      # what was measured, including one failure that is still unexplained. Unpin when that
      # work is scheduled.
      - dependency-name: "org.duckdb:duckdb_jdbc"

  # The documentation site's JavaScript. Without this entry nothing updates it: the nanoid
  # advisory (GHSA-2v37-7h3g-55p8) sat open because Dependabot was watching Maven, Actions and
  # Docker only, and a security alert with no ecosystem behind it never becomes a pull request.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      # The site is a build-time dependency tree: astro and its Starlight plugins move
      # together, and reviewing them one at a time buys nothing.
      docs-site:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    ignore:
      # The JDK in the tag is the declared baseline (docs/jvm-baseline.md) and the tags are
      # not semver, so this image is updated manually.
      - dependency-name: mcr.microsoft.com/devcontainers/java

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # The JDK in these tags is the declared baseline (docs/jvm-baseline.md) and the tags are
      # not semver: updated manually.
      - dependency-name: maven
      - dependency-name: eclipse-temurin
