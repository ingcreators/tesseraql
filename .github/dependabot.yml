version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Plugin patch/minor bumps land together; library and major bumps stay individual.
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
        update-types:
          - minor
          - patch
    ignore:
      # DuckDB 1.5 is a DuckLake semantics migration wearing a version bump: writes of up to
      # ten rows are inlined into the catalog until flushed, and reclaiming files needs a
      # rewrite step that expire-then-cleanup no longer implies. docs/ducklake-1.5.md records
      # what was measured, including one failure that is still unexplained. Unpin when that
      # work is scheduled.
      - dependency-name: "org.duckdb:duckdb_jdbc"

  # The documentation site's JavaScript. Without this entry nothing updates it: the nanoid
  # advisory (GHSA-2v37-7h3g-55p8) sat open because Dependabot was watching Maven, Actions and
  # Docker only, and a security alert with no ecosystem behind it never becomes a pull request.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      # The site is a build-time dependency tree: astro and its Starlight plugins move
      # together, and reviewing them one at a time buys nothing.
      docs-site:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The VS Code extension's build toolchain. Nothing here ships: package.json declares no
  # `dependencies`, packaging runs `vsce package --no-dependencies`, and .vscodeignore drops
  # node_modules — so every advisory this manifest raises is development-scope. This entry does
  # not close those advisories, and adding it earlier would not have closed any of them: each
  # was transitive under an already-newest @vscode/vsce, and a version update only reaches
  # direct dependencies. Raising a transitive floor is a hand-run command (SECURITY.md,
  # "Dependency advisories"). What this entry buys is that the four direct devDependencies stop
  # drifting unwatched, which is how those floors move on their own.
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    groups:
      # Four devDependencies behind one build (tsc, then `vsce package`): upkeep lands as one
      # pull request, and majors stay individual — a compiler major is the whole toolchain.
      vscode-extension:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # A floor, not a version to keep current: `engines.vscode: ^1.90.0` is the oldest editor
      # supported, and @types/vscode must match it or the compiler stops rejecting API that
      # floor does not have. Raising it is a support decision made in package.json. The gap is
      # a semver minor, so only a blanket ignore holds it; that suppresses security updates
      # too, which is acceptable for a declarations-only package that ships no code.
      - dependency-name: "@types/vscode"
      # The same argument one axis narrower: `engines.node: >=22`, and both workflows install
      # Node 22, so the major is the decision and minors inside it are upkeep.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    ignore:
      # The JDK in the tag is the declared baseline (docs/jvm-baseline.md) and the tags are
      # not semver, so this image is updated manually.
      - dependency-name: mcr.microsoft.com/devcontainers/java

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # The JDK in these tags is the declared baseline (docs/jvm-baseline.md) and the tags are
      # not semver: updated manually.
      - dependency-name: maven
      - dependency-name: eclipse-temurin
