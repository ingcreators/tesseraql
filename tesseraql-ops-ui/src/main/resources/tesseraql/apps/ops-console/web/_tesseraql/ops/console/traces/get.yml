version: tesseraql/v1
id: tql.opsConsole.traces
kind: route
recipe: query-html

security:
  policy: ops.batch.view

sources:
  main:
    sql:
      service:
        name: ops.traces
        params:
          # Narrows visibility to the caller's ops.app.<name> grants (deny by default).
          permissions: principal.permissions
response:
  html:
    status: 200
    template: traces.html
    model:
      traces: sql
