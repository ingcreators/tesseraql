version: tesseraql/v1
id: tql.opsConsole.execution
kind: route
recipe: query-html

security:
  policy: ops.batch.view

input:
  started:
    type: string
    required: false

sources:
  main:
    service:
      name: ops.execution
      params:
        id: path.id
        # Executions outside the caller's ops.app.<name> grants render as not found.
        permissions: principal.permissions
response:
  html:
    status: 200
    template: execution.html
    model:
      execution: main
      started: params.started
