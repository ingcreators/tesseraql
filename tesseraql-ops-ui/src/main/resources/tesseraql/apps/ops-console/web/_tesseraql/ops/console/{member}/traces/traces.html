<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: ops-member-page(#{tql.ops.page.traces(${traces.shell.label})}, ${traces.shell}, ~{:: #page-header}, ~{:: #page-content})}">
<th:block id="page-header">
  <span class="hc-spacer"></span>
  <div class="hc-cluster">
    <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{|${traces.shell.base}${traces.shell.slotQuery}|}" th:text="#{tql.ops.larrOverview}">&larr; overview</a>
  </div>
</th:block>
<div id="page-content" class="hc-stack" th:hx-get="@{|${traces.shell.base}/traces${traces.shell.slotQuery}|}" hx-trigger="every 15s"
     hx-select="#page-content" hx-target="this" hx-swap="outerHTML">
<section class="hc-card">
  <div class="hc-card__header" th:text="#{tql.ops.traces}">Traces</div>
  <div class="hc-card__body hc-stack">
    <div class="hc-empty" th:unless="${traces.hasSpans}"><p class="hc-empty__title" th:text="#{tql.ops.noTracesRetained}">No traces retained.</p></div>
    <div class="hc-datagrid" th:if="${traces.hasSpans}">
      <div class="hc-datagrid__scroll">
        <table class="hc-datagrid__table">
          <thead class="hc-datagrid__head"><tr>
            <th class="hc-datagrid__headcell" th:text="#{tql.ops.span}">Span</th>
            <th class="hc-datagrid__headcell" th:text="#{tql.ops.app}">App</th>
            <th class="hc-datagrid__headcell" data-numeric th:text="#{tql.ops.totalMs}">Total (ms)</th>
            <th class="hc-datagrid__headcell" data-numeric th:text="#{tql.ops.selfMs}">Self (ms)</th>
            <th class="hc-datagrid__headcell"></th>
          </tr></thead>
          <tbody class="hc-datagrid__body">
            <tr class="hc-datagrid__row" th:each="s : ${traces.spans}">
              <td class="hc-datagrid__cell" th:style="'padding-left:' + ${s.indentPx} + 'px'"><strong th:classappend="${s.slow} ? 'hc-status'"
                  th:attr="data-variant=${s.slow ? 'error' : null}" th:text="${s.name}"></strong></td>
              <td class="hc-datagrid__cell" th:text="${s.app}"></td>
              <td class="hc-datagrid__cell" data-numeric th:text="${s.totalMs}"></td>
              <td class="hc-datagrid__cell" data-numeric th:text="${s.selfMs}"></td>
              <td class="hc-datagrid__cell"><span class="hc-badge" data-variant="error" th:if="${s.error}" th:text="#{tql.ops.error2}">error</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
</div>
</html>
