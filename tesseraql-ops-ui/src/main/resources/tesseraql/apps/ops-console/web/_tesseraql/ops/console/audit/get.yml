version: tesseraql/v1
id: tql.opsConsole.audit
kind: route
recipe: query-html

# The business-route audit trail (docs/ops-console-coverage.md): the same rows, scope
# narrowing and policy as GET /_tesseraql/ops/audit. The page is always mounted; the
# provider reports whether the flag-gated store is on.
security:
  policy: ops.batch.view

# The filter narrows the fetched newest-200 window (route/actor contains, status
# starts-with); the page states the window.
input:
  route:
    type: string
    required: false
  actor:
    type: string
    required: false
  status:
    type: string
    required: false

sources:
  main:
    service:
      name: ops.audit
      params:
        # Narrows visibility to the caller's ops.app.<name> grants (deny by default).
        permissions: principal.permissions
        route: params.route
        actor: params.actor
        status: params.status
response:
  html:
    status: 200
    template: audit.html
    model:
      audit: main
      route: params.route
      actor: params.actor
      status: params.status
