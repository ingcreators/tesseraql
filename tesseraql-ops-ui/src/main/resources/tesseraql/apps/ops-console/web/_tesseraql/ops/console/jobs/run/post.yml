version: tesseraql/v1
id: tql.opsConsole.jobs.run
kind: route
recipe: command-json

# Runs one declared job now (docs/ops-console-actions.md): the hypermedia face of
# POST /_tesseraql/ops/batch/jobs/{jobId}/run - same policy, same scope stance. The
# execution records who triggered it; params ride empty (a params form is its own design).
security:
  policy: ops.batch.run

input:
  id:
    type: string
    required: true

sql:
  service: ops.jobRun
  params:
    id: params.id
    actor: principal.loginId
    # Narrows to the caller's ops.app.<name> grants (deny by default).
    permissions: principal.permissions

response:
  redirect:
    status: 303
    location: /_tesseraql/ops/console/executions/{sql.executionId}?started=1
