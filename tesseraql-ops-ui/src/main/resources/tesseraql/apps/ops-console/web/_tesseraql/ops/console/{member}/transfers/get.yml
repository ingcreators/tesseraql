version: tesseraql/v1
id: tql.opsConsole.transfers
kind: route
recipe: query-html

input:
  slot:
    type: string
    required: false
  Cookie:
    type: string
    required: false

sources:
  main:
    service:
      name: ops.shell.transfers
      params:
        member: path.member
        slot: params.slot
        # The member re-narrows to the caller's tql.ops.view.<name> grants (deny by default).
        permissions: principal.permissions
        cookie: params.Cookie
response:
  html:
    status: 200
    template: transfers.html
    model:
      transfers: main
