version: tesseraql/v1
id: tql.opsConsole.outbox.redeliver
kind: route
recipe: command-json

# Requeues one dead-lettered outbox event (docs/ops-console-actions.md): the hypermedia
# face of POST /_tesseraql/ops/outbox/{id}/redeliver — same policy, same scope stance.
security:
  policy: ops.batch.run

input:
  id:
    type: string
    required: true

steps:
  main:
    sql:
      service:
        name: ops.outboxRedeliver
        params:
          id: params.id
          # Narrows to the caller's ops.app.<name> grants (deny by default).
          permissions: principal.permissions
response:
  redirect:
    status: 303
    location: /_tesseraql/ops/console/outbox?redelivered=1
