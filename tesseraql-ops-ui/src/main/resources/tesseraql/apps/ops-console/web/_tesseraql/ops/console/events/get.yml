version: tesseraql/v1
id: tql.opsConsole.events
kind: route
recipe: query-html

# The messaging-channel queue events log (docs/silent-tolerance.md O1): the outbox page's
# mirror for queue-consume dead-letters, so a consumer that keeps throwing is visible here.
security:
  policy: ops.batch.view

input:
  redelivered:
    type: string
    required: false

sql:
  service: ops.events
  params:
    # Narrows visibility to the caller's ops.app.<name> grants (deny by default).
    permissions: principal.permissions

response:
  html:
    status: 200
    template: events.html
    model:
      events: sql
      redelivered: params.redelivered
