version: tesseraql/v1
id: tql.studio.apply
kind: route
recipe: command-json

input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  path:
    type: string
    required: true
  force:
    type: string
    required: false
  confirm:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.apply
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        path: params.path
        force: params.force
        confirm: params.confirm
        actor: principal.loginId
        permissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/source?path={params.path}&applied=1
