version: tesseraql/v1
id: tql.studio.wizard.scim.apply
kind: route
recipe: query-html

input:
  groups:
    type: string
    required: false
  outbound:
    type: string
    required: false
  outboundUrl:
    type: string
    required: false
  tokenRef:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.wizard.scim.apply
      params:
        groups: params.groups
        outbound: params.outbound
        outboundUrl: params.outboundUrl
        tokenRef: params.tokenRef
        roles: principal.roles
        actor: principal.loginId
response:
  html:
    status: 200
    template: applied.html
    model:
      result: main
