version: tesseraql/v1
id: tql.studio.tryit.record
kind: route
recipe: command-json

input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  method:
    type: string
    required: true
  path:
    type: string
    required: true
  query:
    type: string
    required: false
  body:
    type: string
    required: false
  name:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.tryRecord
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        method: params.method
        path: params.path
        query: params.query
        body: params.body
        name: params.name
        permissions: principal.permissions
        actor: principal.loginId
response:
  redirect:
    status: 303
    location: /_tesseraql/studio/ui/source?path=tests%2Fstudio-recorded-test.yml
