version: tesseraql/v1
id: tql.studio.newRoute
kind: route
recipe: command-json

input:
  path:
    type: string
    required: true
  recipe:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.newRoute
      params:
        path: params.path
        recipe: params.recipe
        permissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/source?path={params.path}
