version: tesseraql/v1
id: tql.studio.messages
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false
  saved:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.messages
      params:
        member: path.member
        shellCookie: params.Cookie
        shellPermissions: principal.permissions
response:
  html:
    status: 200
    template: messages.html
    model:
      msg: main
      saved: params.saved
