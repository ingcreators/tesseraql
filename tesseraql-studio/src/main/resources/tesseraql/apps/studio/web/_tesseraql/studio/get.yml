version: tesseraql/v1
id: tql.studio.home
kind: route
recipe: query-html

# The workshop switcher (docs/studio-shell.md structural decision 2): one Studio per stack,
# listing the members whose tql.studio.edit atom the caller holds — deny-by-default, so no
# grants means an empty switcher, not an open door. Each member's workshop re-checks the same
# atom on every delegated call; this page only decides what is listed.

sources:
  main:
    service:
      name: studio.shell.nav
      params:
        shellPermissions: principal.permissions

response:
  html:
    template: home.html
    model:
      studio: main
