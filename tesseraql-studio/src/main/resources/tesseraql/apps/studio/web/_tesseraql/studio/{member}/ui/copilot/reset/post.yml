version: tesseraql/v1
id: tql.studio.copilot.reset
kind: route
recipe: command-json

input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.copilot.reset
      params:
        member: path.member
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        shellPermissions: principal.permissions
        actor: principal.loginId
response:
  redirect:
    status: 303
    location: /_tesseraql/studio/ui/copilot
