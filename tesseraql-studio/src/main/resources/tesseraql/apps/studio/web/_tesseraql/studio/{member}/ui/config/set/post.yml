version: tesseraql/v1
id: tql.studio.config.set
kind: route
recipe: command-json

# Overrides one curated, whitelisted setting in config/overlay.yml (or removes it when blank). The
# key is validated against StudioService's whitelist; edit-gated in the provider; restart to apply.
input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  key:
    type: string
    required: true
  value:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.configSet
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        key: params.key
        value: params.value
        actor: principal.loginId
        principalPermissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/config?saved=1
