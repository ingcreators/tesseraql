version: tesseraql/v1
id: tql.studio.command
kind: route
recipe: query-html

# The command palette's dynamic groups (docs/studio-ux-refresh.md slice 7): every route and
# job as an open-in-editor entry, and each route folder as a "new route here" entry — loaded
# lazily into the shell's palette the first time it opens (hx-trigger="intersect once").

sources:
  main:
    service:
      name: studio.command
      params:
        roles: principal.roles
response:
  html:
    status: 200
    template: command.html
    model:
      cmd: sql
