version: tesseraql/v1
id: tql.studio.migration.create
kind: route
recipe: query-html

input:
  datasource:
    type: string
    required: false
  vendor:
    type: string
    required: false
  kind:
    type: string
    required: false
  description:
    type: string
    required: true
  ddl:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.migration.create
      params:
        datasource: params.datasource
        vendor: params.vendor
        kind: params.kind
        description: params.description
        ddl: params.ddl
        actor: principal.loginId
        roles: principal.roles
response:
  html:
    status: 200
    template: created.html
    model:
      mig: sql
