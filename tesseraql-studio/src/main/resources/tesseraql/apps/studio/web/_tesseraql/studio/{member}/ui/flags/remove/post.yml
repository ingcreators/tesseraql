version: tesseraql/v1
id: tql.studio.flags.remove
kind: route
recipe: command-json

# Removes a feature flag from config/flags.yml (edit-gated).
input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  name:
    type: string
    required: true

steps:
  - id: main
    service:
      name: studio.shell.studio.flagsRemove
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        name: params.name
        actor: principal.loginId
        principalPermissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/flags?removed=1
