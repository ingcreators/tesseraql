version: tesseraql/v1
id: tql.studio.sqlBuilder.build
kind: route
recipe: query-html

input:
  table:
    type: string
    required: true
  operation:
    type: string
    required: true
  column:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.sqlBuilder.build
      params:
        table: params.table
        operation: params.operation
        column: params.column
response:
  html:
    status: 200
    template: build.html
    model:
      b: sql
