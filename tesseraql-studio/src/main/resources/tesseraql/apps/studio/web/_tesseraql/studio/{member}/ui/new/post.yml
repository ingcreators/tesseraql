version: tesseraql/v1
id: tql.studio.newRoute
kind: route
recipe: command-json

input:
  _csrf:
    type: string
    required: false
  path:
    type: string
    required: true
  recipe:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.newRoute
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token
        path: params.path
        recipe: params.recipe
        permissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/source?path={params.path}
