version: tesseraql/v1
id: tql.studio.security
kind: route
recipe: query-html

input:
  added:
    type: string
    required: false
  removed:
    type: string
    required: false
  # Status chips + search (docs/studio-ux-refresh.md slice 6): narrow the routes table
  # server-side; the stat tiles always show the full counts.
  status:
    type: string
    required: false
  q:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.security
      params:
        roles: principal.roles
        status: params.status
        q: params.q
response:
  html:
    status: 200
    template: security.html
    model:
      sec: sql
      added: params.added
      removed: params.removed
