version: tesseraql/v1
id: tql.docs.releaseDiff.capture
kind: route
recipe: command-json

# Captures both diff baselines in one action (docs/studio-schema-lifecycle.md):
# schema.baseline.json copies the schema sidecar, openapi.baseline.json persists the
# live OpenAPI document. Replaces the hand-copy instructions this page used to print.

steps:
  - id: main
    service:
      name: studio.baselineCapture
      params:
        actor: principal.loginId
        roles: principal.roles
response:
  redirect:
    status: 303
    location: /_tesseraql/studio/ui/docs/release-diff?captured=1
