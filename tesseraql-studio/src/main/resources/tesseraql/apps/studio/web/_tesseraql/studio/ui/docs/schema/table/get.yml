version: tesseraql/v1
id: tql.studio.docs.table
kind: route
recipe: query-html

input:
  ds:
    type: string
    required: true
  name:
    type: string
    required: true

sources:
  main:
    service:
      name: docs.table
      params:
        ds: query.ds
        name: query.name
response:
