version: tesseraql/v1
id: tql.studio.docs.export.pdf
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.docs.routesPdf
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie

response:
  html:
    status: 200
    template: pdf.html
    model:
      docs: main
    headers:
      Content-Security-Policy: "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' data:; frame-ancestors 'none'"
