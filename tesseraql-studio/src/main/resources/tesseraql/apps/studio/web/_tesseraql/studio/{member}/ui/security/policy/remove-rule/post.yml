version: tesseraql/v1
id: tql.studio.policy.removeRule
kind: route
recipe: command-json

# Revokes a role/permission rule from a policy (writes the reduced set to config/overlay.yml), then
# rebinds the live PolicyEngine. Edit-gated in the provider.
input:
  _csrf:
    type: string
    required: false
  policy:
    type: string
    required: true
  kind:
    type: string
    required: true
  value:
    type: string
    required: true

steps:
  - id: main
    service:
      name: studio.shell.studio.policyRemoveRule
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token
        policy: params.policy
        kind: params.kind
        value: params.value
        actor: principal.loginId
        principalPermissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/security?removed=1
