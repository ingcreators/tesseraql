version: tesseraql/v1
id: tql.studio.migration.migrate
kind: route
recipe: query-html

input:
  _csrf:
    type: string
    required: false
  confirm:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.migration.migrate
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token
        confirm: params.confirm
        actor: principal.loginId
        permissions: principal.permissions
response:
  html:
    status: 200
    template: migrate.html
    model:
      mig: main
