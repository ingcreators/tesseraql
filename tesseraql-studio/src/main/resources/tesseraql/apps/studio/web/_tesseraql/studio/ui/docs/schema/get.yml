version: tesseraql/v1
id: tql.studio.docs.schema
kind: route
recipe: query-html

input:
  sort:
    type: string
    required: false
  dir:
    type: string
    required: false
  refreshed:
    type: string
    required: false

sources:
  main:
    service:
      name: docs.schema
      params:
        sort: params.sort
        dir: params.dir
        roles: principal.roles
response:
  html:
    status: 200
    template: schema.html
    model:
      sch: sql
      refreshed: params.refreshed
