<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: studio-page(|TesseraQL Studio · ${studio.appName}|, ~{:: #page-header}, ~{:: #page-content})}">
<th:block id="page-header">
  <span class="hc-spacer"></span>
  <div class="hc-cluster">
    <!-- The section links moved to the Studio sidebar nav (track H1); the header keeps the
         mode badge so the editable/read-only state stays visible from the landing page. -->
    <span class="hc-badge" data-variant="warning" th:if="${studio.readOnly}">read-only</span>
    <span class="hc-badge" data-variant="success" th:if="${studio.editable}">editable</span>
  </div>
</th:block>
<div id="page-content" class="hc-stack">
<!-- One card, one job (docs/studio-ux-refresh.md slice 3, the review's Explorer mockup): the
     Routes & jobs card owns its toolbar — filter + create actions live in the card header, not
     in a separate card whose only content was a button and a sentence of seven links. "New
     route" stays a drawer trigger (hx-get into the remote-dialog root; the kit opens the
     swapped hc-drawer as a side panel, so the tree stays in view). The sibling creation flows
     collapse into a "Create ▾" popover menu. -->
<section class="hc-card">
  <div class="hc-card__header">
    Routes &amp; jobs
    <span class="hc-spacer"></span>
    <input class="hc-input" data-size="sm" id="explorer-filter" type="search" name="q"
           th:value="${studio.query}" aria-label="Filter by id, path, recipe"
           placeholder="Filter by id, path, recipe…" autocomplete="off"
           hx-get="/_tesseraql/studio/ui" hx-trigger="keyup changed delay:250ms, search"
           hx-target="#explorer-tree" hx-select="#explorer-tree" hx-swap="outerHTML"
           hx-indicator="next .htmx-indicator">
    <th:block th:replace="~{tql/shell :: busy('Filtering…')}"/>
    <th:block th:if="${studio.editable}">
      <button type="button" class="hc-button" data-variant="primary" data-size="sm"
              hx-get="/_tesseraql/studio/ui/new" hx-target="#new-route-dialog" hx-swap="innerHTML">New route</button>
      <button type="button" class="hc-button" data-size="sm" popovertarget="explorer-create-menu">Create &#9662;</button>
      <div class="hc-popover" id="explorer-create-menu" popover data-side="bottom" data-align="end">
        <nav class="hc-menu" aria-label="Create with">
          <a class="hc-menu__item" href="/_tesseraql/studio/ui/scaffold">Scaffold</a>
          <a class="hc-menu__item" href="/_tesseraql/studio/ui/migration">Migration</a>
          <a class="hc-menu__item" href="/_tesseraql/studio/ui/wizard">Wizards</a>
          <a class="hc-menu__item" href="/_tesseraql/studio/ui/calendars">Calendars</a>
          <a class="hc-menu__item" href="/_tesseraql/studio/ui/jobs">Job policies</a>
          <a class="hc-menu__item" href="/_tesseraql/studio/ui/connectors">Connectors</a>
          <a class="hc-menu__item" href="/_tesseraql/studio/ui/copilot">Copilot</a>
        </nav>
      </div>
    </th:block>
  </div>
  <div class="hc-card__body hc-stack">
  <!-- installRemoteDialog opens the first <dialog> swapped in here with showModal() (the drawer). -->
  <div id="new-route-dialog" data-hc-remote-dialog-root th:if="${studio.editable}"></div>
  <div id="explorer-tree" class="hc-stack" th:with="root=${studio.tree}">
    <div class="hc-empty" th:if="${root.empty}">
      <p class="hc-empty__title" th:text="${#strings.isEmpty(studio.query)} ? 'No routes or jobs defined.' : 'No routes or jobs match.'">No matches.</p>
    </div>
    <th:block th:each="folder : ${root.folders}">
      <th:block th:replace="~{:: explorerNode(${folder})}"></th:block>
    </th:block>
    <th:block th:each="leaf : ${root.leaves}">
      <th:block th:replace="~{:: explorerLeaf(${leaf})}"></th:block>
    </th:block>
  </div>
  </div>
</section>
</div>
<th:block th:fragment="explorerNode(folder)">
  <details class="tql-tree" open>
    <summary th:text="${folder.name}"></summary>
    <div class="hc-stack tql-tree__children">
      <!-- Contextual create (Studio sidebar IA): opens the New-route drawer with its Path seeded to
           this folder's prefix, so a new route lands where you are browsing, not a path typed from
           memory. Same remote-dialog root as the top "New route" trigger. -->
      <button th:if="${studio.editable}" type="button" class="hc-button tql-tree__new"
              data-variant="ghost" data-size="sm"
              th:attr="hx-get=|/_tesseraql/studio/ui/new?prefix=${folder.path}/|"
              hx-target="#new-route-dialog" hx-swap="innerHTML">+ New route here</button>
      <th:block th:each="child : ${folder.folders}">
        <th:block th:replace="~{:: explorerNode(${child})}"></th:block>
      </th:block>
      <th:block th:each="leaf : ${folder.leaves}">
        <th:block th:replace="~{:: explorerLeaf(${leaf})}"></th:block>
      </th:block>
    </div>
  </details>
</th:block>
<div class="hc-cluster" th:fragment="explorerLeaf(leaf)">
  <span class="hc-badge"
        th:attr="data-variant=${leaf.kind == 'job'} ? 'info' : (${leaf.kind == 'draft'} ? 'success' : null)"
        th:text="${leaf.badge}"></span>
  <a th:href="${leaf.sourceUrl}" th:text="${leaf.label}"></a>
  <span class="hc-field__message" th:text="${leaf.recipe}" th:unless="${#strings.isEmpty(leaf.recipe)}"></span>
  <!-- Draft state (Studio sidebar IA): a served entry with an unsaved draft, and a conflict when the
       source moved underneath it. A new draft is its own leaf (kind=draft, the 'new' badge above). -->
  <span class="hc-badge" data-variant="warning" th:if="${leaf.edited}">unsaved draft</span>
  <span class="hc-badge" data-variant="error" th:if="${leaf.conflict}">conflict</span>
</div>
</html>
