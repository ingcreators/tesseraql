version: tesseraql/v1
id: tql.studio.tryit
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false
  path:
    type: string
    required: false
  method:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.tryit
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        path: params.path
        method: params.method
response:
  html:
    status: 200
    template: try.html
    model:
      tryit: main
