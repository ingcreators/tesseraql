version: tesseraql/v1
id: tql.studio.decisionBuilder.build
kind: route
recipe: query-html

# Generates the decide: YAML referencing one declared decision (pure text; copy into the route).
input:
  _csrf:
    type: string
    required: false
  decision:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.decisionBuilder.build
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token
        decision: params.decision
response:
  html:
    status: 200
    template: build.html
    model:
      db: main
