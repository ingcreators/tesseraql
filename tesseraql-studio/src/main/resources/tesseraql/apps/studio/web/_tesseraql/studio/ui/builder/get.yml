version: tesseraql/v1
id: tql.studio.builder
kind: route
recipe: query-html

input:
  path:
    type: string
    required: true
  saved:
    type: string
    required: false
  applied:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.pageBuilder
      params:
        roles: principal.roles
        path: query.path
response:
  html:
    status: 200
    template: builder.html
    model:
      cmp: main
      saved: params.saved
      applied: params.applied
    headers:
      # frame-src 'self' admits both builder iframes: the srcdoc canvas (same-origin
      # stylesheets, no scripts) and the sandboxed rendered preview (source editor policy).
      Content-Security-Policy: "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' data:; frame-ancestors 'none'"
