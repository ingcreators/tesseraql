version: tesseraql/v1
id: tql.studio.connectors.webhook
kind: route
recipe: command-json

input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  name:
    type: string
    required: true
  secret:
    type: string
    required: true
  signatureHeader:
    type: string
    required: false
  timestampHeader:
    type: string
    required: false
  idHeader:
    type: string
    required: false
  tolerance:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.connectors.webhook
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        name: params.name
        secret: params.secret
        signatureHeader: params.signatureHeader
        timestampHeader: params.timestampHeader
        idHeader: params.idHeader
        tolerance: params.tolerance
        permissions: principal.permissions
        actor: principal.loginId
response:
  redirect:
    status: 303
    location: /_tesseraql/studio/ui/connectors?saved=1
