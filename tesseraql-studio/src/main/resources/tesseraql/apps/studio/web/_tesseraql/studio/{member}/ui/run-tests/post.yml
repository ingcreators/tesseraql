version: tesseraql/v1
id: tql.studio.runTests
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  path:
    type: string
    required: true

sources:
  main:
    service:
      name: studio.shell.studio.runTests
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        path: params.path
response:
  html:
    status: 200
    template: run-tests.html
    model:
      tests: main
