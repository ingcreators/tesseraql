version: tesseraql/v1
id: tql.studio.menu
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false
  added:
    type: string
    required: false
  moved:
    type: string
    required: false
  removed:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.menu.view
      params:
        member: path.member
        shellCookie: params.Cookie
        shellPermissions: principal.permissions
response:
  html:
    status: 200
    template: menu.html
    model:
      menu: main
      added: params.added
      moved: params.moved
      removed: params.removed
