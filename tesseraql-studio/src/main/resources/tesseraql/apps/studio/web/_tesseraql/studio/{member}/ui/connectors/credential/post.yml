version: tesseraql/v1
id: tql.studio.connectors.credential
kind: route
recipe: command-json

input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  scope:
    type: string
    required: true
  name:
    type: string
    required: true
  type:
    type: string
    required: true
  token:
    type: string
    required: false
  username:
    type: string
    required: false
  password:
    type: string
    required: false
  header:
    type: string
    required: false
  value:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.connectors.credential
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        scope: params.scope
        name: params.name
        type: params.type
        token: params.token
        username: params.username
        password: params.password
        header: params.header
        value: params.value
        permissions: principal.permissions
        actor: principal.loginId
response:
  redirect:
    status: 303
    location: /_tesseraql/studio/ui/connectors?saved=1
