version: tesseraql/v1
id: tql.studio.migration.diff
kind: route
recipe: query-html

input:
  _csrf:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.migration.diff
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token

response:
  html:
    status: 200
    template: diff.html
    model:
      build: main
