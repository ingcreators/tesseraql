version: tesseraql/v1
id: tql.studio.policy.addRule
kind: route
recipe: command-json

# Grants a policy a role/permission rule (creating the policy if new) in config/overlay.yml, then
# rebinds the live PolicyEngine. Edit-gated in the provider.
input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  policy:
    type: string
    required: true
  kind:
    type: string
    required: true
  value:
    type: string
    required: true

steps:
  - id: main
    service:
      name: studio.shell.studio.policyAddRule
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        policy: params.policy
        kind: params.kind
        value: params.value
        actor: principal.loginId
        principalPermissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/security?added=1
