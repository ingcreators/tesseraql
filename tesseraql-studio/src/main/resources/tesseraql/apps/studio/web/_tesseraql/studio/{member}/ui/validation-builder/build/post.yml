version: tesseraql/v1
id: tql.studio.validationBuilder.build
kind: route
recipe: query-html

# Generates the validate: YAML for one rule from the form inputs (pure text; copy into the route).
input:
  _csrf:
    type: string
    required: false
  operation:
    type: string
    required: true
  source:
    type: string
    required: false
  field:
    type: string
    required: false
  value:
    type: string
    required: false
  value2:
    type: string
    required: false
  id:
    type: string
    required: false
  code:
    type: string
    required: false
  message:
    type: string
    required: false
  when:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.validationBuilder.build
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token
        operation: params.operation
        source: params.source
        field: params.field
        value: params.value
        value2: params.value2
        id: params.id
        code: params.code
        message: params.message
        when: params.when
response:
  html:
    status: 200
    template: build.html
    model:
      vb: main
