version: tesseraql/v1
id: tql.studio.config
kind: route
recipe: query-html

input:
  saved:
    type: string
    required: false
  # Key/value search (docs/studio-ux-refresh.md slice 6): narrows the effective-config
  # table server-side; the header count always shows the full total.
  q:
    type: string
    required: false

sql:
  service: studio.config
  params:
    roles: principal.roles
    q: params.q

response:
  html:
    status: 200
    template: config.html
    model:
      cfg: sql
      saved: params.saved
