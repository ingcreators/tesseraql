version: tesseraql/v1
id: tql.studio.explorer
kind: route
recipe: query-html

input:
  q:
    type: string
    required: false
  # The command palette's "new route here" entry (docs/studio-ux-refresh.md slice 7):
  # landing with ?create=<prefix>/ opens the New-route drawer seeded to that folder.
  create:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.explorer
      params:
        q: params.q
        create: params.create
        permissions: principal.permissions
response:
  html:
    status: 200
    template: explorer.html
    model:
      studio: main
