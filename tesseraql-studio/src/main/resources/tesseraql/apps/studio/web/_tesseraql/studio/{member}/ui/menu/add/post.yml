version: tesseraql/v1
id: tql.studio.menu.add
kind: route
recipe: command-json

# Appends an item to the app's config/menu.yml (declarative, role-filtered sidebar menu). Edit-gated
# in the provider; the running app's menu reloads after. Redirects back to the editor.
input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  label:
    type: string
    required: true
  href:
    type: string
    required: true
  icon:
    type: string
    required: false
  roles:
    type: string
    required: false
  permissions:
    type: string
    required: false

steps:
  - id: main
    service:
      name: studio.shell.studio.menu.add
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        label: params.label
        href: params.href
        icon: params.icon
        roles: params.roles
        itemPermissions: params.permissions
        actor: principal.loginId
        principalPermissions: principal.permissions
response:
  redirect:
    location: /_tesseraql/studio/ui/menu?added=1
