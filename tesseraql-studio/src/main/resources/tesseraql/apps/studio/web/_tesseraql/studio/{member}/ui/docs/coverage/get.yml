version: tesseraql/v1
id: tql.studio.docs.coverage
kind: route
recipe: query-html

sources:
  main:
    service:
      name: studio.shell.docs.coverage
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie

response:
  html:
    status: 200
    template: coverage.html
    model:
      cov: main
