version: tesseraql/v1
id: tql.studio.docs.schema.refresh
kind: route
recipe: command-json

input:
  _csrf:
    type: string
    required: false

# Introspects the runtime's own datasources and rewrites the schema sidecar
# (docs/studio-schema-lifecycle.md) - the in-Studio replacement for the schema goal.

steps:
  - id: main
    service:
      name: studio.shell.studio.schemaRefresh
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token
        actor: principal.loginId
        permissions: principal.permissions
response:
  redirect:
    status: 303
    location: /_tesseraql/studio/ui/docs/schema?refreshed=1
