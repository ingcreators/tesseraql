version: tesseraql/v1
id: tql.studio.docs.export
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.docs.export
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie

response:
  html:
    status: 200
    template: export.html
    model:
      docs: main
