version: tesseraql/v1
id: tql.studio.wizard.preview
kind: route
recipe: query-html

# The wizards' Review-YAML step (docs/studio-ux-refresh.md slice 5): renders the SAME
# .yml.tpl the download serves, escaped into the page, so the generated YAML is reviewed
# before either the download or the overlay write. The inputs are the union of every
# wizard's fields, all optional — a half-filled form previews with blanks, not an error.
input:
  kind:
    type: string
    required: true
  discoveryUri:
    type: string
    required: false
  clientId:
    type: string
    required: false
  redirectUri:
    type: string
    required: false
  scopes:
    type: string
    required: false
  postLoginUrl:
    type: string
    required: false
  provision:
    type: string
    required: false
  spAudience:
    type: string
    required: false
  acsUrl:
    type: string
    required: false
  ssoUrl:
    type: string
    required: false
  sloUrl:
    type: string
    required: false
  idpMetadataPath:
    type: string
    required: false
  publicKeyPath:
    type: string
    required: false
  loginIdAttribute:
    type: string
    required: false
  emailAttribute:
    type: string
    required: false
  nameIdFormat:
    type: string
    required: false
  groups:
    type: string
    required: false
  outbound:
    type: string
    required: false
  outboundUrl:
    type: string
    required: false
  tokenRef:
    type: string
    required: false
  realmId:
    type: string
    required: false
  type:
    type: string
    required: false
  datasource:
    type: string
    required: false
  sqlRoot:
    type: string
    required: false
  userManagement:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.wizard.preview
      params:
        kind: params.kind
        discoveryUri: params.discoveryUri
        clientId: params.clientId
        redirectUri: params.redirectUri
        scopes: params.scopes
        postLoginUrl: params.postLoginUrl
        provision: params.provision
        spAudience: params.spAudience
        acsUrl: params.acsUrl
        ssoUrl: params.ssoUrl
        sloUrl: params.sloUrl
        idpMetadataPath: params.idpMetadataPath
        publicKeyPath: params.publicKeyPath
        loginIdAttribute: params.loginIdAttribute
        emailAttribute: params.emailAttribute
        nameIdFormat: params.nameIdFormat
        groups: params.groups
        outbound: params.outbound
        outboundUrl: params.outboundUrl
        tokenRef: params.tokenRef
        realmId: params.realmId
        type: params.type
        datasource: params.datasource
        sqlRoot: params.sqlRoot
        userManagement: params.userManagement
response:
  html:
    status: 200
    template: preview.html
    model:
      w: sql
