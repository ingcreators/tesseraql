version: tesseraql/v1
id: tql.docs.releaseDiff
kind: route
recipe: query-html

input:
  captured:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.docs.releaseDiff
      params:
        member: path.member
        shellCookie: header.Cookie
        shellPermissions: principal.permissions
response:
  html:
    status: 200
    template: release-diff.html
    model:
      docs: main
      captured: params.captured
