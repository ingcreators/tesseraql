version: tesseraql/v1
id: tql.studio.docs
kind: route
recipe: query-html

input:
  sort:
    type: string
    required: false
  dir:
    type: string
    required: false

sources:
  main:
    service:
      name: docs.index
      params:
        sort: params.sort
        dir: params.dir
response:
  html:
    status: 200
    template: docs.html
    model:
      docs: main
