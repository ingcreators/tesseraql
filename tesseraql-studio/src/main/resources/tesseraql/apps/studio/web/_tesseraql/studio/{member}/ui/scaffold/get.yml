version: tesseraql/v1
id: tql.studio.scaffold
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.scaffold.tables
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie

response:
  html:
    status: 200
    template: scaffold.html
    model:
      scaffold: main
