version: tesseraql/v1
id: tql.studio.ejectView
kind: route
recipe: query-html

input:
  path:
    type: string
    required: true
  confirm:
    type: string
    required: false
  force:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.ejectView
      params:
        permissions: principal.permissions
        path: params.path
        confirm: params.confirm
        force: params.force
response:
  html:
    status: 200
    template: eject-view.html
    model:
      eject: main
