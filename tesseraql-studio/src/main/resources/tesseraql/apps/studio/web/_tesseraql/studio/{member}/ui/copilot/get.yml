version: tesseraql/v1
id: tql.studio.copilot
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.copilot.view
      params:
        member: path.member
        shellCookie: params.Cookie
        shellPermissions: principal.permissions
        actor: principal.loginId
response:
  html:
    status: 200
    template: copilot.html
    model:
      chat: main
