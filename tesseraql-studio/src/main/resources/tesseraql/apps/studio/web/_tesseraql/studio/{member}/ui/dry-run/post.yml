version: tesseraql/v1
id: tql.studio.migration.dryRun
kind: route
recipe: query-html

input:
  _csrf:
    type: string
    required: false
  path:
    type: string
    required: true
  content:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.migration.dryRun
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: header.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: header.X-CSRF-Token
        path: params.path
        content: params.content
response:
  html:
    status: 200
    template: dry-run.html
    model:
      dryRun: main
