version: tesseraql/v1
id: tql.studio.scaffold.apply
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false
  _csrf:
    type: string
    required: false
  X-CSRF-Token:
    type: string
    required: false
  table:
    type: string
    required: true
  force:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.studio.scaffold.apply
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie
        shellCsrf: params._csrf
        shellCsrfHeader: params.X-CSRF-Token
        table: params.table
        force: params.force
        actor: principal.loginId
        permissions: principal.permissions
response:
  html:
    status: 200
    template: apply.html
    model:
      scaffold: main
