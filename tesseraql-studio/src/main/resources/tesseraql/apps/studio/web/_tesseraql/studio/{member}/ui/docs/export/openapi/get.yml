version: tesseraql/v1
id: tql.studio.docs.export.openapi
kind: route
recipe: query-html

input:
  Cookie:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.shell.docs.openapi
      params:
        member: path.member
        shellPermissions: principal.permissions
        shellCookie: params.Cookie

response:
  file:
    template: openapi.json.tpl
    contentType: "application/json; charset=utf-8"
    filename: openapi.json
    model:
      openapi: main
