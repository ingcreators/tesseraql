version: tesseraql/v1
id: tql.studio.mail.composer
kind: route
recipe: query-html

input:
  path:
    type: string
    required: true
  saved:
    type: string
    required: false
  applied:
    type: string
    required: false

sql:
  service: studio.mailComposer
  params:
    roles: principal.roles
    path: query.path

response:
  html:
    status: 200
    template: composer.html
    model:
      cmp: sql
      saved: params.saved
      applied: params.applied
    headers:
      # frame-src 'self' admits the sandboxed srcdoc iframe previewing the rendered mail
      # (same policy as the source editor's rendered preview).
      Content-Security-Policy: "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' data:; frame-ancestors 'none'"
