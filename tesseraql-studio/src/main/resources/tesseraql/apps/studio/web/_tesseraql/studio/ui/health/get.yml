version: tesseraql/v1
id: tql.studio.health
kind: route
recipe: query-html

# Severity chips + search (docs/studio-ux-refresh.md slice 6): both narrow the findings
# table server-side; the stat tiles always show the full counts.
input:
  severity:
    type: string
    required: false
  q:
    type: string
    required: false

sources:
  main:
    service:
      name: studio.health
      params:
        severity: params.severity
        q: params.q
response:
  html:
    status: 200
    template: health.html
    model:
      health: sql
