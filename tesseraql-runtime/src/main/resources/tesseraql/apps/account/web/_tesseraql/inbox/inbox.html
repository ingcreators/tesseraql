<!DOCTYPE html>
<!-- The notification inbox (roadmap Phase 49): the page behind the shell's bell. Bodies are
     plain text rendered escaped - a notification never carries markup into the page. -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: shell(#{tql.inbox.pageTitle}, ~{:: #inbox-nav}, ~{}, ~{:: #page-content})}">
<th:block id="inbox-nav">
  <a class="hc-item" th:href="@{/_tesseraql/inbox}"><span class="hc-item__media" aria-hidden="true"><svg class="hc-icon"><use th:href="@{/assets/_tesseraql/icons.svg#bell}"/></svg></span><span class="hc-item__title" th:text="#{tql.inbox.title}">Inbox</span></a>
  <a class="hc-item" th:href="@{/_tesseraql/account}"><span class="hc-item__media" aria-hidden="true"><svg class="hc-icon"><use th:href="@{/assets/_tesseraql/icons.svg#users}"/></svg></span><span class="hc-item__title" th:text="#{tql.account.title}">Account</span></a>
</th:block>
<div id="page-content" class="hc-stack">
  <section class="hc-card">
    <div class="hc-card__header"><h1 th:text="#{tql.inbox.title}">Inbox</h1></div>
    <div class="hc-card__body hc-stack">
    <div class="hc-empty" th:unless="${inbox.enabled}">
      <p class="hc-empty__title" th:text="#{tql.inbox.notConfigured}">No inbox channels are configured.</p>
      <p class="hc-empty__description" th:utext="#{tql.inbox.notConfiguredDescription}">Declare a notification channel with <code>type: inbox</code>
        under <code>tesseraql.notifications.channels</code> and address a
        <code>notify:</code> with <code>recipient:</code> — see <code>docs/inbox.md</code>.</p>
    </div>
    <th:block th:if="${inbox.enabled}">
      <div class="hc-cluster">
        <p th:text="#{tql.inbox.unread(${inbox.unread})}">0 unread</p>
        <form method="post" th:action="@{/_tesseraql/inbox/read-all}"
              th:if="${inbox.unread > 0}">
          <input type="hidden" name="_csrf" th:value="${_csrf}">
          <button class="hc-button" data-variant="ghost" data-size="sm" type="submit" th:text="#{tql.inbox.markAllRead}">Mark all read</button>
        </form>
      </div>
      <div class="hc-empty" th:if="${#lists.isEmpty(inbox.messages)}">
        <p class="hc-empty__title" th:text="#{tql.inbox.empty}">Nothing here yet.</p>
      </div>
      <ul class="hc-stack tql-plain-list" th:unless="${#lists.isEmpty(inbox.messages)}">
        <li th:each="message : ${inbox.messages}" class="hc-card">
          <div class="hc-cluster">
            <strong th:text="${message.title}">title</strong>
            <span class="hc-badge" th:unless="${message.read}" th:text="#{tql.inbox.new}">new</span>
            <span class="hc-spacer"></span>
            <small class="hc-field__message" th:text="${#temporals.format(message.createdAt, 'yyyy-MM-dd HH:mm', #locale)}">time</small>
          </div>
          <p th:if="${!#strings.isEmpty(message.body)}" th:text="${message.body}">body</p>
          <div class="hc-cluster">
            <small class="hc-field__message" th:text="${message.source}">source</small>
            <span class="hc-spacer"></span>
            <form method="post" th:action="@{/_tesseraql/inbox/read}" th:unless="${message.read}">
              <input type="hidden" name="_csrf" th:value="${_csrf}">
              <input type="hidden" name="eventId" th:value="${message.eventId}">
              <button class="hc-button" data-variant="ghost" data-size="sm" type="submit" th:text="#{tql.inbox.markRead}">Mark read</button>
            </form>
          </div>
        </li>
      </ul>
    </th:block>
    </div>
  </section>
</div>
</html>
