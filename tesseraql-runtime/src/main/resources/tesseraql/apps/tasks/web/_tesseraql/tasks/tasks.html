<!DOCTYPE html>
<!-- The task queue (docs/workflow-surface.md decision 6): the open workflow tasks the
     signed-in user may act on, most urgent first. The queue lists, the detail acts: a row
     links to the document's detail page when a detail view declares the task's workflow,
     where the transitions region offers exactly the legal moves. A task records the state it
     is open in, not the transition owed. -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: shell(#{tql.tasks.pageTitle}, ~{:: #tasks-nav}, ~{}, ~{:: #page-content})}">
<!-- One nav item, itself: the inbox and the account pages are the stack's under a host, and
     the shell's account chip and bell reach them by the right rule wherever this page mounts. -->
<th:block id="tasks-nav">
  <a class="hc-item" th:href="@{/_tesseraql/tasks}"><span class="hc-item__media" aria-hidden="true"><svg class="hc-icon"><use th:href="@{/assets/_tesseraql/icons.svg#list-checks}"/></svg></span><span class="hc-item__title" th:text="#{tql.tasks.title}">Tasks</span></a>
</th:block>
<div id="page-content" class="hc-stack">
  <section class="hc-card">
    <div class="hc-card__header">
      <h1 th:text="#{tql.tasks.heading}">My tasks</h1>
      <span class="hc-spacer"></span>
      <p th:if="${tasks.enabled}" th:text="${tasks.truncated} ? #{tql.tasks.openOrMore(${tasks.count})} : #{tql.tasks.open(${tasks.count})}">0 open</p>
    </div>
    <div class="hc-card__body hc-stack">
    <div class="hc-empty" th:unless="${tasks.enabled}">
      <p class="hc-empty__title" th:text="#{tql.tasks.unavailable}">Workflow tasks are not available on this runtime.</p>
    </div>
    <th:block th:if="${tasks.enabled}">
      <!-- Over the cap the count above hedges (the result-cap stance): finish or reassign
           some, and the rest surface. -->
      <div class="hc-alert" data-variant="warning" role="status" th:if="${tasks.truncated}">
        <p class="hc-alert__title" th:text="#{tql.tasks.truncated}">Showing your first 200 open tasks.</p>
      </div>
      <div class="hc-empty" th:if="${#lists.isEmpty(tasks.rows)}">
        <p class="hc-empty__title" th:text="#{tql.tasks.none}">Nothing waiting on you.</p>
      </div>
      <table class="hc-table" th:unless="${#lists.isEmpty(tasks.rows)}">
        <thead><tr>
          <th th:text="#{tql.tasks.document}">Document</th><th th:text="#{tql.tasks.state}">State</th><th th:text="#{tql.tasks.due}">Due</th><th th:text="#{tql.tasks.via}">Via</th>
        </tr></thead>
        <tbody>
          <tr th:each="task : ${tasks.rows}">
            <td>
              <a th:if="${task.href != ''}" th:href="@{${task.href}}"
                 th:text="|${task.docType} ${task.docId}|">doc D-1</a>
              <span th:if="${task.href == ''}"
                    th:text="|${task.docType} ${task.docId}|">doc D-1</span>
            </td>
            <td><span class="hc-badge" th:text="${task.state}">review</span></td>
            <td th:text="${task.dueAt}">2026-09-01</td>
            <td>
              <span th:if="${task.group != ''}" th:text="${task.group}">approvers</span>
              <span th:if="${task.delegatedFrom != ''}"
                    th:text="#{tql.tasks.for(${task.delegatedFrom})}">for approver-1</span>
            </td>
          </tr>
        </tbody>
      </table>
    </th:block>
    </div>
  </section>
</div>
</html>
