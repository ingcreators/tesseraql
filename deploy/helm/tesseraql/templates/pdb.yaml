{{- if and .Values.pdb.enabled (gt (int .Values.replicaCount) 1) }}
# A voluntary disruption — a node drain — never takes the last pod; node failure is the
# replicas' and the anti-affinity's business.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tesseraql.fullname" . }}
  labels:
    {{- include "tesseraql.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "tesseraql.selectorLabels" . | nindent 6 }}
{{- end }}
