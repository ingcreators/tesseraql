{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tesseraql.serviceAccountName" . }}
  labels:
    {{- include "tesseraql.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The runtime never calls the Kubernetes API; a mounted token would be a credential for nothing.
automountServiceAccountToken: false
{{- end }}
