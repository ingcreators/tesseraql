apiVersion: v2
name: tesseraql
description: >-
  A TesseraQL stack on Kubernetes: one Deployment of the deployment's derived image, its Service,
  the probes, the drain, the rolling contract and the optional migration hook (docs/kubernetes.md).
type: application
# Set from the release tag by release.yml (helm package --version/--app-version). The committed
# value is a placeholder, so the rendering under deploy/kubernetes/ carries no version and does
# not change with every release; the image tag says which version runs.
version: 0.0.0
appVersion: "0.0.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/ingcreators/tesseraql
sources:
  - https://github.com/ingcreators/tesseraql
maintainers:
  - name: ingcreators
