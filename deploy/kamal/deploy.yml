# Kamal 2 template for a TesseraQL app on Lightsail behind Cloudflare Tunnel
# (docs/deployment.md). Copy into your app repository as config/deploy.yml and adjust.

service: myapp
image: my-org/myapp

servers:
  web:
    - 203.0.113.10            # Lightsail instance (only SSH open; HTTP enters via the tunnel)

registry:
  server: ghcr.io
  username: my-org
  password:
    - KAMAL_REGISTRY_PASSWORD

# Before `kamal deploy`: `tesseraql package --app . --out build/myapp.tqlapp`, unpacked under
# build/stack/myapp (docs/deployment.md, "Shipping apps"). The image derives from the official
# runtime image and carries that package; nothing is compiled in the build.
builder:
  arch: amd64
  dockerfile: deploy/Dockerfile
  args:
    BASE: ghcr.io/ingcreators/tesseraql-host:latest   # pin a version in production
    APP_DIR: build/stack/myapp
    APP_NAME: myapp           # tesseraql.app.name: the directory under /stack and the address (/myapp/)

# The stop grace (docs/deployment.md, "Bootstrap and migrations"): on SIGTERM the runtime
# drains in-flight work for up to tesseraql.shutdown.timeout (45s by default) and then closes.
# Kamal's default for a proxied role is Docker's ten seconds, which kills the drain two thirds
# of the way through; both waits sit above the bound plus the close's margin.
drain_timeout: 60
stop_timeout: 60

proxy:
  app_port: 8080
  healthcheck:
    path: /_tesseraql/health/ready  # 503 while draining or when every member is DOWN; details stay behind the ops API
  # No public TLS: cloudflared connects outbound to Cloudflare; the proxy only does
  # zero-downtime container swaps on localhost.
  ssl: false
  host: myapp.example.com

env:
  clear:
    TESSERAQL_SECRETS_DIR: /run/secrets
  secret:
    - DB_PASSWORD             # referenced from config as ${secret.env.DB_PASSWORD}

volumes:
  - tesseraql-work:/stack/myapp/work  # spools and the upload staging area

accessories:
  cloudflared:
    image: cloudflare/cloudflared:latest
    cmd: tunnel run
    env:
      secret:
        - TUNNEL_TOKEN        # from the Cloudflare Zero Trust dashboard
    roles:
      - web
