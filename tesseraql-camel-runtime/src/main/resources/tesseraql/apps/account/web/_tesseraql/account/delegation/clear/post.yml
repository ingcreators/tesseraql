version: tesseraql/v1
id: tql.account.delegation.clear
kind: route
recipe: command-json

# Clears the caller's own out-of-office rule (roadmap Phase 52). Idempotent.

steps:
  - id: main
    service:
      name: account.delegation.clear
      params:
        subject: principal.subject
        tenantId: principal.tenantId
response:
  redirect:
    status: 303
    location: /_tesseraql/account?saved=delegation-cleared
