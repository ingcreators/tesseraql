version: tesseraql/v1
id: tql.account.home
kind: route
recipe: query-html

# The signed-in user's account page (roadmap Phase 48): the profile facts, with the
# self-service settings sections joining in later slices. The subject is always the session
# principal's — the route maps principal.* into the service params, so the page can only
# ever describe the caller.

# The post/redirect/get flash flag: every save lands back here naming what it did, and
# the page confirms it (docs/console-ux-refresh.md slice 2).
input:
  saved:
    type: string
    required: false

sources:
  main:
    service:
      name: account.settings.view
      params:
        subject: principal.subject
        loginId: principal.loginId
        displayName: principal.displayName
        tenantId: principal.tenantId
        roles: principal.roles
        permissions: principal.permissions
  # What the caller may take but does not hold (docs/access-governance.md structural
  # decision 3). A separate source because an eligibility is not part of the principal:
  # it grants nothing, so it must stay out of every resolution read.
  eligibility:
    service:
      name: account.eligibility
      params:
        subject: principal.subject
response:
  html:
    status: 200
    template: account.html
    model:
      profile: main
      saved: params.saved
      eligibility: eligibility.rows
      eligibilityAvailable: eligibility.available
    headers:
      Cache-Control: "no-store"
