# The port this application binds, internal to the stack: 0 = ephemeral. The front
# door is the dev/host gateway's --port.
server:
  port: 0

db:
  main:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/user_admin
    username: ${DB_USER:user_admin}
    password: ${DB_PASSWORD:user_admin}
    maximumPoolSize: 10
