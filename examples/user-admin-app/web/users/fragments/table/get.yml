version: tesseraql/v1
id: users.table
kind: route
recipe: query-html

input:
  q:
    type: string
    required: false

security:
  policy: users.read

sources:
  main:
    sql:
      file: search-table.sql
      mode: query
      params:
        q: query.q
response:
  html:
    status: 200
    template: table.html
    model:
      users: main.rows
      criteria: params
      count: main.rowCount
    headers:
      HX-Trigger:
        hc:toast:
          message: Search completed
          variant: success
