# tesseraql-scaffold-checksum: sha256:4696d8a3bdb8803cbf1fa5385f0b191437982df0623fbf9aef192f366f061cf5
# Scaffolded field domains for the items table (tesseraql scaffold crud --table items):
# every route's input: references these, so the DDL-derived knowledge lives once
# (docs/field-domains.md). Route-operational keys (required) stay in the routes.
version: tesseraql/v1

domains:
  items.id:
    type: integer
  items.version:
    type: integer
  items.name:
    type: string
    maxLength: 200
  items.quantity:
    type: integer
  items.unit_price:
    type: number
  items.due_date:
    type: date
    format: yyyy-MM-dd
  items.active:
    type: boolean
  items.note:
    type: string
    maxLength: 1000

constraints:
  uq_items_name:
    field: name
