# tesseraql-scaffold-checksum: sha256:097cd1e5bc7a6b7a5ebf1a2d3004877df9c1748d1f9e646f0458bf2f1bc0fec3
# Scaffolded field domains for the items table (tesseraql scaffold crud --table items):
# every route's input: references these, so the DDL-derived knowledge lives once
# (docs/field-domains.md). Route-operational keys (required) stay in the routes.
version: tesseraql/v1

domains:
  items.id:
    type: integer
  items.name:
    type: string
    maxLength: 200
  items.quantity:
    type: integer
  items.unit_price:
    type: number
  items.due_date:
    type: date
    format: yyyy-MM-dd
  items.active:
    type: boolean
  items.note:
    type: string
    maxLength: 1000

constraints:
  uq_items_name:
    field: name
