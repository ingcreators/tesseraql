# tesseraql-scaffold-checksum: sha256:09e0f66a94fbe328d333c37c3c49cb1b753e8fea850bfd4febea9a9b6cce716a
# Scaffolded suite for the items table (design ch. 13): exercises the generated
# queries with data-independent expectations, so it passes against any contents.
version: tesseraql/v1
tests:
  - name: the items search runs without a filter
    sql:
      file: web/items/search.sql
    params:
      sort: id
      dir: asc

  - name: the items search filters by name
    sql:
      file: web/items/search.sql
    params:
      q: no-such-row
      sort: id
      dir: asc
    expect:
      rowCount: 0

  - name: the items search sorts by name descending
    sql:
      file: web/items/search.sql
    params:
      sort: name
      dir: desc

  - name: the items detail select misses for an unknown key
    sql:
      file: web/items/{id}/select.sql
    params:
      id: -1
    expect:
      rowCount: 0

  - name: the items update runs for an unmatched key
    sql:
      file: web/items/{id}/update/update.sql
    lock:
      route: items.update
      value: 1
    params:
      id: -1
    expect:
      updateCount: 0

  - name: the items delete runs for an unmatched key
    sql:
      file: web/items/{id}/delete/delete.sql
    lock:
      route: items.delete
      value: 1
    params:
      id: -1
    expect:
      updateCount: 0
