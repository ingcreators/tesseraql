# tesseraql-scaffold-checksum: sha256:f3aca98d3bb2c4c8c6e8ff85967f727b116e6b36afa3462c5a7902767d861fec
# Scaffolded list view for the items table: renders through the tql/view/list-page
# pattern (docs/declarative-views.md "The grid page") — sortable headers, a live
# search box, row identity for return-to-the-list, and the header slot's New
# button.
version: tesseraql/v1
id: items
kind: view
recipe: list
layout: page
key: id
title: Items
search: q
columns:
  - name: id
    sortable: true
  - name: name
    sortable: true
  - name: quantity
    sortable: true
  - name: unit_price
    sortable: true
  - name: due_date
    sortable: true
  - name: active
    sortable: true
  - name: note
    sortable: true
  - name: id
    label: ""
    text: Open
    link: /items/{id}
slots:
  header: frags.html::new-link
