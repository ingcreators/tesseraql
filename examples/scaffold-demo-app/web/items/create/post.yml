# tesseraql-scaffold-checksum: sha256:d6042a73b1e6d78e992479b23a776d7bd3603925c270d89d169d2f52d394fa69
# Scaffolded create command for the items table: one transaction, audit binds, and
# field-level constraint errors (docs/transactional-writes.md).
version: tesseraql/v1
id: items.create
kind: route
recipe: command-json

input:
  name:
    domain: items.name
    required: true
  quantity:
    domain: items.quantity
    required: true
  unit_price:
    domain: items.unit_price
  due_date:
    domain: items.due_date
  active:
    domain: items.active
    required: true
  note:
    domain: items.note

inputPolicy:
  unknownFields: reject

security:
  policy: app.write

validate:
  name_is_free:
    use: items_name_is_free
    params:
      name: params.name
      excludeId: params.id
    field: name

steps:
  - id: record
    sql:
      file: insert.sql
      mode: update
      keys: [id]
      params:
        name: params.name
        quantity: params.quantity
        unit_price: params.unit_price
        due_date: params.due_date
        active: params.active
        note: params.note

response:
  redirect:
    location: /items/{steps.record.keys.id}
