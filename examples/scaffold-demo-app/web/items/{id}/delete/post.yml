# tesseraql-scaffold-checksum: sha256:0ebf2675eeb8b91c798a2cc059fb90b80507da4ddbde4bdef29c68e32bad8172
# Scaffolded delete command for the items table: its own declared lock refuses a stale delete.
version: tesseraql/v1
id: items.delete
kind: route
recipe: command-json
lock: { column: version, type: integer }

input:
  id:
    domain: items.id
    required: true

inputPolicy:
  unknownFields: reject

security:
  policy: app.write

steps:
  - id: main
    sql:
      file: delete.sql
      mode: update
      params:
        id: params.id

response:
  redirect:
    location: /items
