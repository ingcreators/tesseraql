# tesseraql-scaffold-checksum: sha256:4d35ed97d6b91c194d6e5f7a7682eab8f330a9ca91ccb872c4e0a12641909155
# Scaffolded update command for the items table: a declared lock turns a stale edit into 409 Conflict.
version: tesseraql/v1
id: items.update
kind: route
recipe: command-json
lock: { column: version, type: integer }

input:
  id:
    domain: items.id
    required: true
  name:
    domain: items.name
    required: true
  quantity:
    domain: items.quantity
    required: true
  unit_price:
    domain: items.unit_price
  due_date:
    domain: items.due_date
  active:
    domain: items.active
    required: true
  note:
    domain: items.note

inputPolicy:
  unknownFields: reject

security:
  policy: app.write

validate:
  name_is_free:
    use: items_name_is_free
    params:
      name: params.name
      excludeId: params.id
    field: name

steps:
  - id: main
    sql:
      file: update.sql
      mode: update
      params:
        id: params.id
        name: params.name
        quantity: params.quantity
        unit_price: params.unit_price
        due_date: params.due_date
        active: params.active
        note: params.note

response:
  redirect:
    location: /items/{path.id}
