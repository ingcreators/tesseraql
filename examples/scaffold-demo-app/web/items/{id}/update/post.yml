# tesseraql-scaffold-checksum: sha256:c4c4c32e29562a2b1dd5ca7ec34e55b02f1ad38fff6bf798b56a02efbb8185b9
# Scaffolded update command for the items table: optimistic locking turns a stale edit into 409 Conflict.
version: tesseraql/v1
id: items.update
kind: route
recipe: command-json

input:
  id:
    domain: items.id
    required: true
  name:
    domain: items.name
    required: true
  quantity:
    domain: items.quantity
    required: true
  unitPrice:
    domain: items.unitPrice
  dueDate:
    domain: items.dueDate
  active:
    domain: items.active
    required: true
  note:
    domain: items.note
  version:
    domain: items.version
    required: true

inputPolicy:
  unknownFields: reject

security:
  policy: app.write

validate:
  nameIsFree:
    use: itemsNameIsFree
    params:
      name: params.name
      excludeId: params.id
    field: name

sql:
  file: update.sql
  mode: update
  expect:
    rows: 1
    onMismatch: conflict
  params:
    id: params.id
    name: params.name
    quantity: params.quantity
    unitPrice: params.unitPrice
    dueDate: params.dueDate
    active: params.active
    note: params.note
    version: params.version

response:
  redirect:
    location: /items/{path.id}
