# tesseraql-scaffold-checksum: sha256:443b67b2d93d59bb21c785efc632e93f7a832c323f070b22510d3556f76eb796
# Scaffolded update command for the items table: optimistic locking turns a stale edit into 409 Conflict.
version: tesseraql/v1
id: items.update
kind: route
recipe: command-json

input:
  id:
    domain: items.id
    required: true
  name:
    domain: items.name
    required: true
  quantity:
    domain: items.quantity
    required: true
  unit_price:
    domain: items.unit_price
  due_date:
    domain: items.due_date
  active:
    domain: items.active
    required: true
  note:
    domain: items.note
  version:
    domain: items.version
    required: true

inputPolicy:
  unknownFields: reject

security:
  policy: app.write

validate:
  name_is_free:
    use: items_name_is_free
    params:
      name: params.name
      excludeId: params.id
    field: name

sql:
  file: update.sql
  mode: update
  expect:
    rowCount: 1
    onMismatch: conflict
  params:
    id: params.id
    name: params.name
    quantity: params.quantity
    unit_price: params.unit_price
    due_date: params.due_date
    active: params.active
    note: params.note
    version: params.version

response:
  redirect:
    location: /items/{path.id}
