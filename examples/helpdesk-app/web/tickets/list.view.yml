version: tesseraql/v1
id: tickets
kind: view
recipe: list
key: id
title: Tickets
search: q
filters: [status, priority]
presets:
  - name: Open tickets
    params: { status: open }
  - name: High priority
    params: { priority: high, sort: "-created_at" }
columns:
  - { name: id, label: "#", link: "/tickets/{id}" }
  - { name: subject, sortable: true }
  - { name: priority, sortable: true }
  - { name: requester }
  - { name: assignee }
  - { name: status, sortable: true }
