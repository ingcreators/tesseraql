version: tesseraql/v1
id: tickets.page
kind: route
recipe: query-html

input:
  q: { type: string, required: false, maxLength: 100 }
  status: { type: string, required: false, maxLength: 32 }
  priority: { type: string, required: false, enum: [low, normal, high] }
  sort: { type: string, required: false }
  dir: { type: string, required: false, enum: [asc, desc] }

security:
  policy: help.read

pagination:
  size: 20
  count: true

sources:
  main:
    sql:
      file: tickets.sql
      mode: query
      params:
        q: query.q
        status: query.status
        priority: query.priority
response:
  html:
    status: 200
    view: tickets
