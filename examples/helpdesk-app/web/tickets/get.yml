version: tesseraql/v1
id: tickets.page
kind: route
recipe: query-html

input:
  q: { type: string, required: false, maxLength: 100 }
  sort: { type: string, required: false }
  dir: { type: string, required: false, enum: [asc, desc] }

security:
  policy: help.read

pagination:
  size: 20
  count: true

sources:
  main:
    sql:
      file: tickets.sql
      mode: query
      params:
        q: query.q
response:
  html:
    status: 200
    view: tickets
