tests:
  # The scope's three postures over the seeded rows (scope/requisitions_scope.yml):
  # procurement sees both departments, a requester sees their own, no matching arm
  # sees nothing (deny-by-default).
  - name: procurement sees every department
    sql:
      file: web/api/requisitions/requisitions.sql
    principal:
      roles: [PROCUREMENT]
    expect:
      rowCount: 2

  - name: a requester sees only their own department
    sql:
      file: web/api/requisitions/requisitions.sql
    principal:
      roles: [REQUESTER]
      claims:
        departments: [engineering]
    expect:
      rowCount: 1
      rows:
        - id: REQ-1001

  - name: no matching scope arm means no rows, not all rows
    sql:
      file: web/api/requisitions/requisitions.sql
    principal:
      roles: [AUDITOR]
    expect:
      rowCount: 0

  - name: lines ride the header's scope
    sql:
      file: web/api/requisitions/{id}/lines/lines.sql
    principal:
      roles: [REQUESTER]
      claims:
        departments: [sales]
    params:
      id: REQ-1001
    expect:
      rowCount: 0

  # The approvalRoute decision (decisions/approval-route.yml): both dimensions and the
  # amount boundary.
  - name: capital categories are two-stage regardless of amount
    decide:
      decision: approvalRoute
    params:
      amount: 50000
      category: it-equipment
    expect:
      rows:
        - route: two_stage

  - name: a large amount escalates any category
    decide:
      decision: approvalRoute
    params:
      amount: 300001
      category: office
    expect:
      rows:
        - route: two_stage

  - name: the threshold itself stays with the manager
    decide:
      decision: approvalRoute
    params:
      amount: 300000
      category: office
    expect:
      rows:
        - route: manager

  # The RFQ leg (slice 2): the seeded draft, its invitations, and the sourcing rule.
  - name: the seeded RFQ carries both invitations
    sql:
      file: web/api/rfqs/{id}/suppliers/suppliers.sql
    params:
      id: RFQ-2001
    expect:
      rowCount: 2
      rows:
        - partner_id: P-100
        - partner_id: P-200

  - name: the RFQ list counts invitations per row
    sql:
      file: web/api/rfqs/rfqs.sql
    expect:
      rowCount: 2
      rows:
        - id: RFQ-2001
          invited: 2
        - id: RFQ-2002
          invited: 2

  - name: an unapproved requisition cannot source an RFQ
    validate:
      route: api.rfqs.create
    params:
      params:
        requisitionId: REQ-1002
    expect:
      rowCount: 1
      rows:
        - rule: requisitionApproved
          field: requisitionId
          code: not-approved

  - name: re-inviting an invited supplier is a zero-row no-op
    sql:
      file: web/api/rfqs/{id}/suppliers/invite.sql
    params:
      id: RFQ-2001
      partnerId: P-100
    expect:
      updateCount: 0

  - name: the quote-collection follow-up lands with the RFQ owner
    sql:
      file: workflow/rfq-owner.sql
    params:
      key: RFQ-2001
    expect:
      rowCount: 1
      rows:
        - assignee: ota

  # The supplier fence (slice 3, scope/quotes_scope.yml): a supplier reaches only
  # their own partner's rows; procurement sees every quote.
  - name: a supplier sees only their own quotes
    sql:
      file: web/api/supplier/quotes/quotes.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-100
    expect:
      rowCount: 2
      rows:
        - id: Q-RFQ-2001-P-100
          status: draft
        - id: Q-RFQ-2002-P-100
          status: submitted

  - name: the competing supplier never sees the other partner's quotes
    sql:
      file: web/api/supplier/quotes/quotes.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-200
    expect:
      rowCount: 1
      rows:
        - id: Q-RFQ-2002-P-200

  - name: procurement sees every quote
    sql:
      file: web/api/supplier/quotes/quotes.sql
    principal:
      roles: [PROCUREMENT]
    expect:
      rowCount: 3

  - name: quote lines ride the quote's partner scope
    sql:
      file: web/api/supplier/quotes/{id}/lines/lines.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-200
    params:
      id: Q-RFQ-2001-P-100
    expect:
      rowCount: 0

  # Pricing runs in the case's rolled-back transaction; the verify read-back observes
  # the uncommitted write under the same principal (docs/testing.md).
  - name: a supplier prices their own line
    sql:
      file: web/api/supplier/quotes/{id}/lines/price-line.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-100
    params:
      id: Q-RFQ-2001-P-100
      lineNo: 1
      unitPrice: 11800
      promisedDate: "2026-08-25"
    expect:
      updateCount: 1
    verify:
      - sql:
          file: web/api/supplier/quotes/{id}/lines/lines.sql
        params:
          id: Q-RFQ-2001-P-100
        expect:
          rowCount: 1
          rows:
            - line_no: 1
              unit_price: "11800.00"

  - name: the competing supplier cannot price another partner's line
    sql:
      file: web/api/supplier/quotes/{id}/lines/price-line.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-200
    params:
      id: Q-RFQ-2001-P-100
      lineNo: 1
      unitPrice: 1
      promisedDate: "2026-08-25"
    expect:
      updateCount: 0

  # Slice 4: the comparison, the deviation contract, and the orderApproval lanes.
  - name: the comparison ranks submitted quotes with distance from the lowest
    sql:
      file: web/api/rfqs/{id}/comparison/comparison.sql
    params:
      id: RFQ-2002
    expect:
      rowCount: 2
      rows:
        - partner_id: P-200
          is_lowest: true
          delta_pct: "0.00"
        - partner_id: P-100
          is_lowest: false
          delta_pct: "0.32"

  - name: selecting a non-lowest quote without a reason is refused
    validate:
      route: api.orders.create
    params:
      params:
        quoteId: Q-RFQ-2002-P-100
    expect:
      rowCount: 1
      rows:
        - rule: selectionReason
          field: reason
          code: reason-required

  - name: a written reason satisfies the deviation contract
    validate:
      route: api.orders.create
    params:
      params:
        quoteId: Q-RFQ-2002-P-100
        reason: Only P-100 can meet the September delivery date
    expect:
      rowCount: 0

  - name: the lowest quote needs no reason
    validate:
      route: api.orders.create
    params:
      params:
        quoteId: Q-RFQ-2002-P-200
    expect:
      rowCount: 0

  - name: creating the order stamps computed selection facts, not client claims
    sql:
      file: web/api/orders/create-order.sql
    params:
      quoteId: Q-RFQ-2002-P-100
      reason: Only P-100 can meet the September delivery date
      audit:
        user: ota
    expect:
      updateCount: 1
    verify:
      - sql:
          file: web/api/orders/orders.sql
        expect:
          rowCount: 1
          rows:
            - partner_id: P-100
              is_lowest: false
              delta_pct: "0.32"

  # The orderApproval decision: both dimensions and the boundary.
  - name: the lowest selection auto-approves
    decide:
      decision: orderApproval
    params:
      isLowest: true
      deltaPct: 0
    expect:
      rows:
        - lane: auto

  - name: a near-lowest selection auto-approves at the boundary
    decide:
      decision: orderApproval
    params:
      isLowest: false
      deltaPct: 3
    expect:
      rows:
        - lane: auto

  - name: anything above the tolerance waits for the head
    decide:
      decision: orderApproval
    params:
      isLowest: false
      deltaPct: 3.01
    expect:
      rows:
        - lane: head_review

  # Slice 5: the table-backed tolerance — the decide case runs the generated SELECT
  # against the suite's database, the same statement production runs.
  - name: a small slip auto-confirms
    decide:
      decision: deliveryAutoAccept
    params:
      slipDays: 3
    expect:
      rows:
        - action: auto_confirm

  - name: the tolerance boundary itself auto-confirms
    decide:
      decision: deliveryAutoAccept
    params:
      slipDays: 5
    expect:
      rows:
        - action: auto_confirm

  - name: a large slip falls to the wildcard review row
    decide:
      decision: deliveryAutoAccept
    params:
      slipDays: 14
    expect:
      rows:
        - action: review

  - name: procurement reads the tolerance rows the decision evaluates
    sql:
      file: web/api/tolerances/tolerances.sql
    expect:
      rowCount: 2
      rows:
        - id: 1
          action: auto_confirm
        - id: 2
          action: review

  - name: widening the tolerance is one row update
    sql:
      file: web/api/tolerances/update-tolerance.sql
    params:
      id: 1
      slipMax: 10
    expect:
      updateCount: 1
    verify:
      - sql:
          file: web/api/tolerances/tolerances.sql
        expect:
          rows:
            - slip_max: 10

  # Slice 6: shipment and receipt — writes are scoped and set-guarded, the export
  # joins the chain end to end.
  - name: an unconfirmed order takes no shipment
    sql:
      file: web/api/orders/{id}/shipment/register-shipment.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-200
    params:
      id: ORD-NONE
      shipDate: "2026-09-05"
      carrier: Sagawa
      deliveryNoteNo: DN-0001
      audit:
        user: minami
    expect:
      updateCount: 0

  - name: the shipment export starts empty and joins partner names
    sql:
      file: web/api/shipments/export/export.sql
    expect:
      rowCount: 0

  - name: the dashboard counts the seeded chain
    sql:
      file: web/dashboard/totals.sql
    expect:
      rowCount: 1
      rows:
        - requisitions: 2
          submitted_quotes: 2
          in_transit: 0

  # Slice 7: the catalogs resolve in both locales.
  - name: the rule messages resolve in Japanese
    messages:
      locale: ja
      keys: [procurement.rules.reasonRequired, procurement.rules.notApproved]
    expect:
      rowCount: 2

  - name: the rule messages resolve in English
    messages:
      locale: en
      keys: [procurement.rules.reasonRequired]
    expect:
      rowCount: 1

  # The SQL guard file (docs/workflow-expressiveness.md): the seeded quote's line is
  # unpriced, so the submit refuses with the guard's own code — as a data row.
  - name: an unpriced quote cannot be submitted, and the refusal names itself
    transition:
      workflow: quote
      key: Q-RFQ-2001-P-100
      id: submit
    principal:
      loginId: kita
      roles: [SUPPLIER]
      claims:
        partner: P-100
    expect:
      rows:
        - code: TQL-WORKFLOW-3202
          guard: unpriced-lines
          from: draft

  - name: pricing the line satisfies the guard and the submit advances
    sql:
      file: web/api/supplier/quotes/{id}/lines/price-line.sql
    principal:
      loginId: kita
      roles: [SUPPLIER]
      claims:
        partner: P-100
    params:
      id: Q-RFQ-2001-P-100
      lineNo: 1
      unitPrice: 11800
      promisedDate: "2026-08-25"
    expect:
      updateCount: 1

  # The transition target (docs/testing.md): the state machine asserted declaratively —
  # the submit advance stamps the decided lane, and a wrong-state fire is a 3201 row.
  - name: submitting the office requisition takes the manager lane
    transition:
      workflow: requisition
      key: REQ-1002
      id: submit
    principal:
      loginId: sato
      roles: [REQUESTER]
      claims:
        departments: [sales]
    expect:
      rows:
        - from: draft
          to: submitted
    verify:
      - sql:
          file: web/api/requisitions/{id}/requisition.sql
        params:
          id: REQ-1002
        expect:
          rows:
            - approval_route: manager

  - name: approving a draft is a conflict row, not an exception
    transition:
      workflow: requisition
      key: REQ-1002
      id: approve
    principal:
      loginId: kishi
      roles: [MANAGER]
      claims:
        departments: [sales]
    expect:
      rows:
        - code: TQL-WORKFLOW-3201
          from: draft

  # The dispatch target (docs/transition-engine.md): the one-button selector asserted
  # as data — a draft fits neither approval lane, and the none-held row names every
  # member it tried.
  - name: the approval dispatch on a draft reports both refusals
    dispatch:
      workflow: requisition
      key: REQ-1002
      id: submit_decision
    principal:
      loginId: kishi
      roles: [MANAGER]
      claims:
        departments: [sales]
    expect:
      rows:
        - code: TQL-WORKFLOW-3202
          dispatch: submit_decision
          attempted: approve,advance

  # The assignment resolvers bind real master rows, not literals.
  - name: the first-stage assignee is the requesting department's manager
    sql:
      file: workflow/approver.sql
    params:
      key: REQ-1001
    expect:
      rowCount: 1
      rows:
        - assignee: mori

  - name: the second stage lands with the procurement head
    sql:
      file: workflow/head.sql
    expect:
      rowCount: 1
      rows:
        - assignee: ota
