tests:
  # The scope's three postures over the seeded rows (scope/requisitions_scope.yml):
  # procurement sees both departments, a requester sees their own, no matching arm
  # sees nothing (deny-by-default).
  - name: procurement sees every department
    sql:
      file: web/api/requisitions/requisitions.sql
    principal:
      roles: [PROCUREMENT]
    expect:
      rowCount: 2

  - name: a requester sees only their own department
    sql:
      file: web/api/requisitions/requisitions.sql
    principal:
      roles: [REQUESTER]
      claims:
        departments: [engineering]
    expect:
      rowCount: 1
      rows:
        - id: REQ-1001

  - name: no matching scope arm means no rows, not all rows
    sql:
      file: web/api/requisitions/requisitions.sql
    principal:
      roles: [AUDITOR]
    expect:
      rowCount: 0

  - name: lines ride the header's scope
    sql:
      file: web/api/requisitions/{id}/lines/lines.sql
    principal:
      roles: [REQUESTER]
      claims:
        departments: [sales]
    params:
      id: REQ-1001
    expect:
      rowCount: 0

  # The approvalRoute decision (decisions/approval-route.yml): both dimensions and the
  # amount boundary.
  - name: capital categories are two-stage regardless of amount
    decide:
      decision: approvalRoute
    params:
      amount: 50000
      category: it-equipment
    expect:
      rows:
        - route: two_stage

  - name: a large amount escalates any category
    decide:
      decision: approvalRoute
    params:
      amount: 300001
      category: office
    expect:
      rows:
        - route: two_stage

  - name: the threshold itself stays with the manager
    decide:
      decision: approvalRoute
    params:
      amount: 300000
      category: office
    expect:
      rows:
        - route: manager

  # The RFQ leg (slice 2): the seeded draft, its invitations, and the sourcing rule.
  - name: the seeded RFQ carries both invitations
    sql:
      file: web/api/rfqs/{id}/suppliers/suppliers.sql
    params:
      id: RFQ-2001
    expect:
      rowCount: 2
      rows:
        - partner_id: P-100
        - partner_id: P-200

  - name: the RFQ list counts invitations per row
    sql:
      file: web/api/rfqs/rfqs.sql
    expect:
      rowCount: 1
      rows:
        - id: RFQ-2001
          invited: 2

  - name: an unapproved requisition cannot source an RFQ
    validate:
      route: api.rfqs.create
    params:
      params:
        requisitionId: REQ-1002
    expect:
      rowCount: 1
      rows:
        - rule: requisitionApproved
          field: requisitionId
          code: not-approved

  - name: re-inviting an invited supplier is a zero-row no-op
    sql:
      file: web/api/rfqs/{id}/suppliers/invite.sql
    params:
      id: RFQ-2001
      partnerId: P-100
    expect:
      updateCount: 0

  - name: the quote-collection follow-up lands with the RFQ owner
    sql:
      file: workflow/rfq-owner.sql
    params:
      key: RFQ-2001
    expect:
      rowCount: 1
      rows:
        - assignee: ota

  # The supplier fence (slice 3, scope/quotes_scope.yml): a supplier reaches only
  # their own partner's rows; procurement sees every quote.
  - name: a supplier sees only their own quote
    sql:
      file: web/api/supplier/quotes/quotes.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-100
    expect:
      rowCount: 1
      rows:
        - id: Q-RFQ-2001-P-100
          status: draft

  - name: the competing supplier sees no quote of the other
    sql:
      file: web/api/supplier/quotes/quotes.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-200
    expect:
      rowCount: 0

  - name: procurement sees every quote
    sql:
      file: web/api/supplier/quotes/quotes.sql
    principal:
      roles: [PROCUREMENT]
    expect:
      rowCount: 1

  - name: quote lines ride the quote's partner scope
    sql:
      file: web/api/supplier/quotes/{id}/lines/lines.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-200
    params:
      id: Q-RFQ-2001-P-100
    expect:
      rowCount: 0

  # Pricing runs in the case's rolled-back transaction; the verify read-back observes
  # the uncommitted write under the same principal (docs/testing.md).
  - name: a supplier prices their own line
    sql:
      file: web/api/supplier/quotes/{id}/lines/price-line.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-100
    params:
      id: Q-RFQ-2001-P-100
      lineNo: 1
      unitPrice: 11800
      promisedDate: "2026-08-25"
    expect:
      updateCount: 1
    verify:
      - sql:
          file: web/api/supplier/quotes/{id}/lines/lines.sql
        params:
          id: Q-RFQ-2001-P-100
        expect:
          rowCount: 1
          rows:
            - line_no: 1
              unit_price: "11800.00"

  - name: the competing supplier cannot price another partner's line
    sql:
      file: web/api/supplier/quotes/{id}/lines/price-line.sql
    principal:
      roles: [SUPPLIER]
      claims:
        partner: P-200
    params:
      id: Q-RFQ-2001-P-100
      lineNo: 1
      unitPrice: 1
      promisedDate: "2026-08-25"
    expect:
      updateCount: 0

  # The assignment resolvers bind real master rows, not literals.
  - name: the first-stage assignee is the requesting department's manager
    sql:
      file: workflow/approver.sql
    params:
      key: REQ-1001
    expect:
      rowCount: 1
      rows:
        - assignee: mori

  - name: the second stage lands with the procurement head
    sql:
      file: workflow/head.sql
    expect:
      rowCount: 1
      rows:
        - assignee: ota
