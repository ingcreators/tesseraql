version: tesseraql/v1
id: procurement.dashboard.view
kind: view
recipe: dashboard
title: Procurement dashboard
panels:
  - { type: stat, source: sql, column: requisitions, title: Requisitions }
  - { type: stat, source: sql, column: open_rfqs, title: Open RFQs }
  - { type: stat, source: sql, column: submitted_quotes, title: Submitted quotes }
  - { type: stat, source: sql, column: in_transit, title: In transit }
  - type: chart
    chart: bar
    source: ordersByState
    title: Orders by state
    x: label
    y: value
  - type: table
    source: openNegotiations
    title: Delivery dates under review
    columns:
      - { name: id, label: Order }
      - { name: partner }
      - { name: proposed_date, label: Proposed }
      - { name: slip_days, label: Slip (days) }
