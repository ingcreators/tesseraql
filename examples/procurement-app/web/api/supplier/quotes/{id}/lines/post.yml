version: tesseraql/v1
id: api.supplier.quotes.price
kind: route
recipe: command-json

input:
  id:
    type: string
    required: true
    maxLength: 140
  lineNo:
    type: integer
    required: true
    min: 1
  unitPrice:
    type: number
    required: true
    min: 0.01
  promisedDate:
    type: string
    required: true
    pattern: '^\d{4}-\d{2}-\d{2}$'

security:
  policy: sup.act

# One statement again: the submit guard asks the database directly
# (workflow/quote-priced.sql), so pricing no longer maintains counters on the side.

steps:
  main:
    sql:
      file: price-line.sql
      mode: update
      params:
        id: path.id
        lineNo: params.lineNo
        unitPrice: params.unitPrice
        promisedDate: params.promisedDate
response:
  json:
    status: 200
    body:
      priced: steps.main.affectedRows
