version: tesseraql/v1
id: api.shipments.export
kind: route
recipe: query-export

security:
  policy: rfq.read

# Synchronous CSV download through the shared file codec (docs/file-transfers.md);
# the optional EDI slice moves exactly this shape over SFTP instead.
export:
  format: csv
  filename: shipments.csv
  # Partner names are Japanese (V7__japanese_names.sql): the mark lets a spreadsheet that
  # sniffs it decode the file as UTF-8 instead of its system code page.
  bom: true

sources:
  main:
    sql:
      file: export.sql