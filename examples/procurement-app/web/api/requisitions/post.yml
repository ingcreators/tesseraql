version: tesseraql/v1
id: api.requisitions.create
kind: route
recipe: command-json

input:
  title:
    type: string
    required: true
    maxLength: 200
  department:
    type: string
    required: true
    maxLength: 40
  category:
    type: string
    required: true
    enum: [it-equipment, capex, office, services]
  amount:
    type: number
    required: true
    min: 0.01
  budgetLabel:
    type: string
    required: false
    maxLength: 120
  internalEstimate:
    type: number
    required: false
    min: 0
  # The header+lines shape (docs/transactional-writes.md): the request carries the
  # line items, one transaction writes header and lines together. items.fields:
  # is the line's own input contract — every element binds, coerces and validates
  # like a top-level field, and a violation addresses itself as lines[2].qty.
  lines:
    type: array
    required: true
    items:
      fields:
        itemId:
          type: string
          required: true
          maxLength: 40
          pattern: "[A-Z]{2}-[0-9]{3}"
        qty:
          type: integer
          required: true
          min: 1
          max: 9999
        desiredDate:
          type: date
          required: false

security:
  policy: req.write

validate:
  linesRequired:
    rule: "params.lines != null && params.lines.size > 0"
    field: lines
    code: lines-required
    message: procurement.rules.linesRequired

steps:
  - id: header
    sql:
      file: create.sql
      keys: [id]
      params:
        title: params.title
        department: params.department
        category: params.category
        amount: params.amount
        budgetLabel: params.budgetLabel
        internalEstimate: params.internalEstimate
  - id: lines
    sql:
      file: create-lines.sql
      params:
        requisitionId: steps.header.keys.id
        lines: params.lines
response:
  json:
    status: 201
    body:
      id: steps.header.keys.id
      created: steps.header.affectedRows
      lines: steps.lines.affectedRows
