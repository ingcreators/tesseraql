version: tesseraql/v1
id: api.orders.dateChange
kind: route
recipe: command-json

input:
  id:
    type: string
    required: true
    maxLength: 64
  proposedDate:
    type: string
    required: true
    pattern: '^\d{4}-\d{2}-\d{2}$'

security:
  policy: sup.act

# The supplier stamps the proposal on their own order (the scope is the authority) and
# the negotiation history keeps the request; the propose_accept / propose_review
# transitions then let the table-backed tolerance judge the slip.
steps:
  - id: stamp
    sql:
      file: stamp-proposal.sql
      params:
        id: path.id
        proposedDate: params.proposedDate
  - id: history
    sql:
      file: record-request.sql
      params:
        id: path.id
response:
  json:
    status: 200
    body:
      proposed: steps.stamp.affectedRows
