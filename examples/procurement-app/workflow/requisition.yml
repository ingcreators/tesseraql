version: tesseraql/v1
id: requisition
kind: workflow
# Managed mode: state, tasks and history live in tql_workflow_* (docs/approval-workflow.md).
# The lane comes from the shared approvalRoute decision (decisions/approval-route.yml):
# submit evaluates it from the document and stamps it, the two approve paths guard on the
# stamped column, so every lane the decision can produce has exactly one path out.
document: { type: requisition, table: purchase_requisitions, key: id }
http: { basePath: /api/requisitions }
security: { auth: bearer, policy: req.act }
initial: draft
states:
  - { id: draft, type: initial }
  - { id: submitted }
  - { id: mgr_approved }
  - { id: approved, type: terminal }
  # Not terminal: a rejected requisition returns to its author for rework.
  - { id: rejected }
transitions:
  - id: submit
    from: draft
    to: submitted
    guard: "document.amount > 0"
    decide:
      approvalRoute:
        use: approvalRoute
        params:
          amount: document.amount
          category: document.category
    # The engine persists the decided lane (docs/workflow-expressiveness.md slice 2);
    # the command carries only the audit note.
    stamp:
      approval_route: decision.approvalRoute.route
    command: submit.sql
    assign: { file: approver.sql }
  # The manager lane finishes in one approval ...
  - id: approve
    from: submitted
    to: approved
    guard: "document.approval_route == 'manager'"
    command: approve.sql
  # ... the two-stage lane passes through the procurement head.
  - id: advance
    from: submitted
    to: mgr_approved
    guard: "document.approval_route == 'two_stage'"
    command: advance.sql
    assign: { file: head.sql }
  - id: approve_final
    from: mgr_approved
    to: approved
    command: approve.sql
  - id: reject
    from: submitted
    to: rejected
    command: reject.sql
  - id: reject_final
    from: mgr_approved
    to: rejected
    command: reject.sql
  - id: rework
    from: rejected
    to: draft
    # The declared clearing: the next submit re-evaluates the decision.
    stamp:
      approval_route: null
    command: rework.sql
# The one-action dispatch (docs/workflow-expressiveness.md): the approver's UI calls
# POST /api/requisitions/{key}/submit_decision and the engine fires whichever member
# the stamped approval_route admits — no client-side lane knowledge.
dispatch:
  - id: submit_decision
    oneOf: [approve, advance]
