version: tesseraql/v1
id: order
kind: workflow
# The chain's third managed document (docs/procurement-demo.md): created from a
# selected quote (web/api/orders), submitted through the orderApproval decision —
# the lowest or near-lowest selection issues without a human in the loop, anything
# else waits for the procurement head. Both lanes leave through `issued`, so the
# enum lint proves nothing the decision can produce is unhandled.
document: { type: order, table: orders, key: id }
basePath: /api/orders
security: { auth: bearer, policy: rfq.act }
initial: draft
states:
  - { id: draft, type: initial }
  - { id: submitted }
  - { id: issued }
  - { id: date_proposed }
  - { id: confirmed }
  - { id: shipped }
  - { id: received, type: terminal }
  - { id: rejected }

transitions:
  - id: submit
    from: draft
    to: submitted
    decide:
      orderApproval:
        use: orderApproval
        params:
          isLowest: document.is_lowest
          deltaPct: document.delta_pct
    stamp:
      approval_lane: decision.orderApproval.lane
    command: { file: order-submit.sql }
    assign: { file: order-approver.sql }
  # The auto lane issues immediately ...
  - id: issue
    from: submitted
    to: issued
    guard: "document.approval_lane == 'auto'"
    command: { file: order-issue.sql }
  # ... the review lane waits for the head's task.
  - id: approve_issue
    from: submitted
    to: issued
    guard: "document.approval_lane == 'head_review'"
    command: { file: order-issue.sql }
  - id: reject
    from: submitted
    to: rejected
    command: { file: order-reject.sql }
  - id: rework
    from: rejected
    to: draft
    stamp:
      approval_lane: null
    command: { file: order-rework.sql }
  # The supplier accepts the promised dates as ordered ... (the supplier-facing
  # transitions override the workflow's buyer-side default policy; the command's
  # scope still confines them to their own partner's rows)
  - id: confirm
    from: issued
    to: confirmed
    security: { auth: bearer, policy: sup.act }
    command: { file: order-confirm.sql }
  # ... or proposes a new date (stamped by /api/orders/{id}/date-change first). The
  # table-backed deliveryAutoAccept decision judges the slip: within tolerance the
  # proposal confirms with no human in the loop, outside it a review task opens for
  # whoever placed the order. Both enum values have exactly one path out.
  # The deliveryAutoAccept judgment lives on the propose dispatch below - evaluated
  # once, inherited by both members (docs/transition-engine.md); the dispatch is these
  # members' intended entry (a direct call has no decision.* to read and refuses).
  - id: propose_accept
    from: issued
    to: confirmed
    security: { auth: bearer, policy: sup.act }
    guard: "decision.deliveryAutoAccept.action == 'auto_confirm'"
    command: { file: apply-proposal.sql }
  - id: propose_review
    from: issued
    to: date_proposed
    security: { auth: bearer, policy: sup.act }
    guard: "decision.deliveryAutoAccept.action == 'review'"
    command: { file: mark-review.sql }
    assign: { file: order-owner.sql }
  - id: accept_date
    from: date_proposed
    to: confirmed
    command: { file: apply-proposal.sql }
  - id: decline_date
    from: date_proposed
    to: issued
    command: { file: clear-proposal.sql }
  # Shipping requires the registered shipment (web/api/orders/{id}/shipment): a SQL
  # guard file (docs/workflow-expressiveness.md), so the refusal names itself instead
  # of surfacing as a generic zero-row conflict.
  - id: ship
    from: confirmed
    to: shipped
    security: { auth: bearer, policy: sup.act }
    guard:
      file: shipment-registered.sql
      code: shipment-not-registered
      message: procurement.ship.unregistered
    command: { file: order-ship.sql }
  # Receiving is the requester's move: the persona who started the chain closes it.
  - id: receive
    from: shipped
    to: received
    security: { auth: bearer, policy: req.act }
    command: { file: order-receive.sql }
# One-action dispatches (docs/workflow-expressiveness.md): the client calls one
# endpoint and the engine picks the member whose guard holds, so the lane knowledge
# (which approval_lane value, which deliveryAutoAccept outcome) stays out of the UI.
# Members remain individually callable for the tour's teaching value.
dispatch:
  # POST /api/orders/{key}/submit_decision releases a submitted order down
  # whichever lane the orderApproval decision stamped.
  - id: submit_decision
    oneOf: [issue, approve_issue]
  # POST /api/orders/{key}/propose lets the supplier propose a date change without
  # knowing whether the slip auto-confirms or opens a review task; the decision
  # evaluates once, here, and the members inherit decision.deliveryAutoAccept.*.
  - id: propose
    decide:
      deliveryAutoAccept:
        use: deliveryAutoAccept
        params:
          slipDays: document.slip_days
    oneOf: [propose_accept, propose_review]
