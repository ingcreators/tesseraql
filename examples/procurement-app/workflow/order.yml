version: tesseraql/v1
id: order
kind: workflow
# The chain's third managed document (docs/procurement-demo.md): created from a
# selected quote (web/api/orders), submitted through the orderApproval decision —
# the lowest or near-lowest selection issues without a human in the loop, anything
# else waits for the procurement head. Both lanes leave through `issued`, so the
# enum lint proves nothing the decision can produce is unhandled.
document: { type: order, table: orders, key: id }
http: { basePath: /api/orders }
security: { auth: bearer, policy: rfq.act }
initial: draft
states:
  - { id: draft, type: initial }
  - { id: submitted }
  - { id: issued }
  - { id: date_proposed }
  - { id: confirmed }
  - { id: shipped }
  - { id: received, type: terminal }
  - { id: rejected }
transitions:
  - id: submit
    from: draft
    to: submitted
    decide:
      orderApproval:
        use: orderApproval
        params:
          isLowest: document.is_lowest
          deltaPct: document.delta_pct
    command: order-submit.sql
    assign: { file: order-approver.sql }
  # The auto lane issues immediately ...
  - id: issue
    from: submitted
    to: issued
    guard: "document.approval_lane == 'auto'"
    command: order-issue.sql
  # ... the review lane waits for the head's task.
  - id: approve_issue
    from: submitted
    to: issued
    guard: "document.approval_lane == 'head_review'"
    command: order-issue.sql
  - id: reject
    from: submitted
    to: rejected
    command: order-reject.sql
  - id: rework
    from: rejected
    to: draft
    command: order-rework.sql
  # The supplier accepts the promised dates as ordered ... (the supplier-facing
  # transitions override the workflow's buyer-side default policy; the command's
  # scope still confines them to their own partner's rows)
  - id: confirm
    from: issued
    to: confirmed
    security: { auth: bearer, policy: sup.act }
    command: order-confirm.sql
  # ... or proposes a new date (stamped by /api/orders/{id}/date-change first). The
  # table-backed deliveryAutoAccept decision judges the slip: within tolerance the
  # proposal confirms with no human in the loop, outside it a review task opens for
  # whoever placed the order. Both enum values have exactly one path out.
  - id: propose_accept
    from: issued
    to: confirmed
    security: { auth: bearer, policy: sup.act }
    decide:
      deliveryAutoAccept:
        use: deliveryAutoAccept
        params:
          slipDays: document.slip_days
    guard: "decision.deliveryAutoAccept.action == 'auto_confirm'"
    command: apply-proposal.sql
  - id: propose_review
    from: issued
    to: date_proposed
    security: { auth: bearer, policy: sup.act }
    decide:
      deliveryAutoAccept:
        use: deliveryAutoAccept
        params:
          slipDays: document.slip_days
    guard: "decision.deliveryAutoAccept.action == 'review'"
    command: mark-review.sql
    assign: { file: order-owner.sql }
  - id: accept_date
    from: date_proposed
    to: confirmed
    command: apply-proposal.sql
  - id: decline_date
    from: date_proposed
    to: issued
    command: clear-proposal.sql
  # Shipping requires the registered shipment (web/api/orders/{id}/shipment): a SQL
  # guard file (docs/workflow-expressiveness.md), so the refusal names itself instead
  # of surfacing as a generic zero-row conflict.
  - id: ship
    from: confirmed
    to: shipped
    security: { auth: bearer, policy: sup.act }
    guard:
      file: shipment-registered.sql
      code: shipment-not-registered
      message: procurement.ship.unregistered
    command: order-ship.sql
  # Receiving is the requester's move: the persona who started the chain closes it.
  - id: receive
    from: shipped
    to: received
    security: { auth: bearer, policy: req.act }
    command: order-receive.sql
