version: tesseraql/v1
id: quote
kind: workflow
# App mode (docs/approval-workflow.md): the quote row's own status column carries the
# state — contrast with the managed requisition and rfq documents, so this app shows
# both modes side by side. The submit guard is a SQL guard file
# (docs/workflow-expressiveness.md) — "every line is priced" is a set condition, asked
# of the database directly; the command's /*%scope */ confines the transition to the
# caller's own partner rows.
mode: app
document: { type: quote, table: quotes, key: id, stateColumn: status }
http: { basePath: /api/supplier/quotes }
security: { auth: bearer, policy: sup.act }
initial: draft
states:
  - { id: draft, type: initial }
  - { id: submitted, type: terminal }
transitions:
  - id: submit
    from: draft
    to: submitted
    guard:
      file: quote-priced.sql
      code: unpriced-lines
      message: procurement.quote.unpriced
    command: quote-submit.sql
