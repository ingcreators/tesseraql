procurement:
  rules:
    duplicate: 同じ件名の申請が既に登録されています。
    notApproved: 承認済みの購買依頼のみ見積依頼の対象にできます。
    reasonRequired: 最安値以外の見積を選定する場合は理由の記入が必要です。
    linesRequired: 購買依頼には少なくとも1件の明細が必要です。
  quote:
    unpriced: すべての明細に単価を入力してから見積を提出してください。
  ship:
    unregistered: 出荷登録を行ってから出荷してください。
