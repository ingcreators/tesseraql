  # by the print templates through #{...} in the export's locale.
  doc:
    currency: 円
    line:
      no: "#"
      item: 品名
      qty: 数量
      unit: 単位
      unitPrice: 単価
      amount: 金額
      promisedDate: 納期
    quote:
      title: 見積書
      number: 見積番号
      issuedOn: 見積日
      notSubmitted: (未提出)
      dueOn: 見積期限
      subject: 件名
      to: 御中
      from: 発行者
      total: 合計 (税抜)
      note: 納期は各明細の回答納期です。単価は税抜です。
