version: tesseraql/v1
id: pricing.dailyReport
kind: job
recipe: batch-pipeline
datasource: analytics

# The export step (docs/jobs.md "The export step"): once the summary refresh lands,
# write the day's report as a CSV through the transfer machinery — retrievable from
# the operations console's transfers page.
trigger:
  after: pricing.loadSummary

pipeline:
  - id: report
    # The step's own arm reads; export: only says how the rows are written
    # (docs/unified-sources.md, decision 7).
    sql:
      file: price-report.sql
      mode: query
    export:
      format: csv
      filename: price-summary-{batch.businessDate}.csv
      columns:
        - { name: sku, label: SKU }
        - { name: best_price, label: Best price }
        - { name: suppliers, label: Suppliers }
  # The delivery leg (docs/jobs.md "The push step"): the same file lands in the local
  # partner drop, whole — staged and renamed, so a poller never reads a partial file.
  # A remote partner is the same step with transport: sftp + a push credential.
  - id: deliver
    push:
      transport: local
      path: outbox/reports
      file: steps.report.transferId
