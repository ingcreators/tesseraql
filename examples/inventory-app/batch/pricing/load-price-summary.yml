version: tesseraql/v1
id: pricing.loadSummary
kind: job
recipe: batch-pipeline
datasource: analytics

# The dashboard holds its lake panels (web/products/dashboard/get.yml) and this run
# appends the snapshot they read: naming the lake table drops those holds once the run
# ends, so the next render shows this run's snapshot (docs/jobs.md "What a run made stale").
invalidates: [price_history]

trigger:
  schedule:
    cron: "0 0 4 * * ?"
    # The daily-consider model: the cron says when to consider, the calendar
    # (calendars/jp.yml) says whether the firing counts - weekends and market
    # holidays have no rows to summarize, so those firings are skipped silently.
    calendar: jp-market

pipeline:
  - id: clear
    sql:
      file: clear-price-summary.sql
      mode: update
  - id: load
    sql:
      file: load-price-summary.sql
      mode: update
  # Every run also lands in the lake's history table - one snapshot per run,
  # time-travelable (docs/duckdb.md "Lake tables").
  - id: ensureHistory
    sql:
      file: ensure-price-history.sql
      mode: update
  - id: appendHistory
    sql:
      file: append-price-history.sql
      mode: update