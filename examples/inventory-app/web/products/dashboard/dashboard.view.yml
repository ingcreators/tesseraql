version: tesseraql/v1
id: products.dashboard.view
kind: view
view: dashboard
title: Inventory dashboard
panels:
  - { type: stat, source: sql, column: products, label: Products }
  - { type: stat, source: sql, column: units, label: Units in stock }
  # The kit chart recipe (docs/analytics-experience.md track 2): two series grouped
  # side-by-side, the reorder floor beside the live stock, per category.
  - type: chart
    kind: bar-grouped
    source: byCategory
    title: Stock by category
    x: label
    yLabel: units
    series:
      - { column: stock, label: In stock }
      - { column: reorder, label: Reorder floor }
  - type: table
    source: lowStock
    title: Below reorder level
    columns:
      - { name: sku, label: SKU }
      - { name: name }
      - { name: stock }
      - { name: reorder_level, label: Reorder at }
  - type: table
    source: supplierPrices
    title: Supplier price drop (files)
    columns:
      - { name: sku, label: SKU }
      - { name: best_price, label: Best price }
      - { name: suppliers }
