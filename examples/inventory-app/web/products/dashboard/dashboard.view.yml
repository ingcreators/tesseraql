version: tesseraql/v1
id: products.dashboard.view
kind: view
recipe: dashboard
title: Inventory dashboard
panels:
  - { type: stat, source: sql, column: products, title: Products }
  - { type: stat, source: sql, column: units, title: Units in stock }
  # The kit chart recipe (docs/analytics-experience.md track 2): two series grouped
  # side-by-side, the reorder floor beside the live stock, per category.
  - type: chart
    chart: bar-grouped
    source: byCategory
    title: Stock by category
    x: label
    yLabel: units
    series:
      - { column: stock, label: In stock }
      - { column: reorder, label: Reorder floor }
  - type: table
    source: lowStock
    title: Below reorder level
    columns:
      - { name: sku, label: SKU }
      - { name: name }
      - { name: stock }
      - { name: reorder_level, label: Reorder at }
  - type: table
    source: supplierPrices
    title: Supplier price drop (files)
    columns:
      - { name: sku, label: SKU }
      - { name: best_price, label: Best price }
      - { name: suppliers }
  # Lake history (docs/duckdb.md): the pricing job appends one snapshot per run —
  # the trend line reads them, and the snapshot list is the time-travel index
  # (query any of them with AT (VERSION => n)).
  - type: chart
    chart: line
    source: priceTrend
    title: Best-price trend (lake)
    x: label
    yLabel: avg best price
    y: avg_price
  - type: table
    source: lakeSnapshots
    title: Lake snapshots
    columns:
      - { name: snapshot_id, label: Version }
      - { name: taken_at, label: Taken at }
