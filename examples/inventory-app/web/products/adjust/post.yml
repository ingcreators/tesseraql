version: tesseraql/v1
id: products.adjust
kind: route
recipe: command-json

# Declarative validation (docs/declarative-validation.md): the rule runs inside the command
# transaction and answers a field-scoped 422 before the UPDATE writes — stock never goes
# negative, and the rule is data the tests can assert without HTTP.
input:
  sku: { domain: sku, required: true }
  delta: { type: integer, required: true, min: -10000, max: 10000 }

security:
  policy: inv.write

validate:
  stockStaysNonNegative:
    file: validate-stock.sql
    params:
      sku: params.sku
      delta: params.delta
    field: delta
    code: insufficient-stock
    message: inventory.adjust.insufficient

steps:
  - id: main
    sql:
      file: adjust.sql
      mode: update
      params:
        sku: params.sku
        delta: params.delta
# The dashboard holds its stock rows (products/dashboard/get.yml); naming the table drops them
# on this node at once and on every other node within the stamp interval.
invalidates: [products]
response:
  json:
    status: 200
    body:
      adjusted: steps.main.affectedRows
