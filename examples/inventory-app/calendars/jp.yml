version: tesseraql/v1

# Business-day calendars (docs/jobs.md "Business-day calendars"): the pricing summary is a
# market-data job — weekends and market holidays have no rows to summarize, so the daily
# cron considers and the calendar decides. Small closed set, so dates: is the right home;
# a holidays table (source:) fits when operations maintains next year's rows without a deploy.
calendars:
  jp-market:
    weekend: [saturday, sunday]
    holidays:
      dates:
        - 2026-01-01
        - 2026-01-02
        - 2026-01-03
        - 2026-01-12
        - 2026-02-11
        - 2026-02-23
        - 2026-03-20
        - 2026-04-29
        - 2026-05-04
        - 2026-05-05
        - 2026-05-06
        - 2026-07-20
        - 2026-08-11
        - 2026-09-21
        - 2026-09-22
        - 2026-09-23
        - 2026-10-12
        - 2026-11-03
        - 2026-11-23
        - 2026-12-31
