version: tesseraql/v1
id: requests.detail
kind: route
recipe: query-html

security:
  policy: pr.read

sources:
  main:
    sql:
      file: request.sql
      mode: query
      params:
        id: path.id
  history:
    sql:
      file: history.sql
      params:
        id: path.id
response:
  html:
    status: 200
    view: requests.detail.view
