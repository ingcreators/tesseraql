version: tesseraql/v1
id: requests.create
kind: route
recipe: command-json

input:
  title:
    type: string
    required: true
    maxLength: 200
  amount:
    type: number
    required: true
    min: 0.01

security:
  policy: pr.write

# The shared duplicate-application guard (rules/requests.yml): the rule's SQL identifies the
# caller through the ambient principal bind, so only the title is wired here.
validate:
  duplicateRequest:
    use: duplicateRequest
    params:
      title: params.title
    field: title

steps:
  - id: main
    sql:
      file: create.sql
      mode: update
      params:
        title: params.title
        amount: params.amount
response:
  json:
    status: 201
    body:
      created: steps.main.affectedRows
