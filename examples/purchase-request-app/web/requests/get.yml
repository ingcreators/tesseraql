version: tesseraql/v1
id: requests.page
kind: route
recipe: query-html

input:
  q:
    type: string
    required: false
    maxLength: 100
  sort: { type: string, required: false }
  dir: { type: string, required: false, enum: [asc, desc] }

security:
  policy: pr.read

# The approval queue is a work queue: membership freezes at search time so acting on
# page 1 never slides rows up from page 2, and a search over the cap renders the
# result-cap reject block in-page (docs/declarative-views.md, "Work queues").
pagination:
  strategy: snapshot
  size: 20
  cap: 500

sources:
  main:
    sql:
      file: requests.sql
      mode: query
      params:
        q: query.q
        keys: params.keys
response:
  html:
    status: 200
    view: requests
