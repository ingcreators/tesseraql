version: tesseraql/v1
tests:
  - name: the request list finds seeded rows and the search narrows
    sql:
      file: web/requests/requests.sql
    expect:
      rowCount: 2

  - name: the search branch matches by title
    sql:
      file: web/requests/requests.sql
    params:
      q: desk
    expect:
      rowCount: 1
      rows:
        - id: PR-1001

  - name: the detail query loads one request
    sql:
      file: web/requests/{id}/request.sql
    params:
      id: PR-1002
    expect:
      rowCount: 1
      rows:
        - title: Conference tickets (2x)


  - name: refiling an identical request violates the shared duplicateRequest rule
    validate:
      route: requests.create
    params:
      params:
        title: Standing desks for the design team
      principal:
        loginId: aoki
    expect:
      rowCount: 1
      rows:
        - rule: duplicateRequest
          field: title
          code: duplicate

  # The approvalRoute decision itself (decisions/approval.yml): params are the input
  # values, the matched row's outputs are the case's row — both lanes and the boundary.
  - name: high-value requests route to finance
    decide:
      decision: approvalRoute
    params:
      amount: 250000
    expect:
      rows:
        - assignee: cfo-1

  - name: the threshold itself stays with the standing approver
    decide:
      decision: approvalRoute
    params:
      amount: 100000
    expect:
      rows:
        - assignee: approver-1

  # The submit transition's assignee resolver consumes the approvalRoute decision
  # (decisions/approval.yml): the runtime seeds decision.* under the statement's
  # parameters exactly as this case does explicitly.
  - name: the assignment resolver binds the decided approver
    sql:
      file: workflow/approver.sql
    params:
      decision:
        approvalRoute:
          assignee: cfo-1
    expect:
      rowCount: 1
      rows:
        - assignee: cfo-1

  - name: a fresh title passes the duplicateRequest rule
    validate:
      route: requests.create
    params:
      params:
        title: Monitor arms for the desks
      principal:
        loginId: aoki
    expect:
      rowCount: 0
