<!DOCTYPE html>
<!-- The shared datagrid table pattern (roadmap Phase 39, docs/declarative-views.md): columns ×
     rows with per-row links, used by the list view and by a detail view's children. A sortable
     column renders a server-driven sort link (aria-sort drives the kit's arrow; the link swaps
     the wrapping #tableId region over htmx, keeping the typed search text). Override via
     templates/tql/view/table.html (customization ladder L2); table(tableId, columns, rows) is
     the public contract. -->
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="table(tableId, columns, rows)">
  <div class="hc-datagrid">
    <div class="hc-datagrid__scroll">
      <table class="hc-datagrid__table">
        <thead class="hc-datagrid__head">
          <tr>
            <!-- The selection column (docs/list-surface.md decision 9): the header checkbox
                 has no name, so it can never leak into the payload. -->
            <th class="hc-datagrid__headcell"
                th:if="${v != null && v['selectable'] == true}">
              <input type="checkbox" class="hc-checkbox"
                     th:attr="aria-label=#{tql.view.selectAll}">
            </th>
            <!-- The row-number column (docs/bulk-report.md decision 4): rendered when the
                 view declares actions:, because its bulk report speaks in these numbers. -->
            <th class="hc-datagrid__headcell" th:if="${v != null && v['numbers'] != null}"
                th:attr="aria-label=#{tql.bulk.numberColumn}">#</th>
            <th class="hc-datagrid__headcell" th:each="c : ${columns}"
                th:attr="data-sortable=${c.sortable != null ? 'true' : null},data-col=${c.sortable != null ? c.name : null},aria-sort=${c.ariaSort}">
              <a th:if="${c.sortable != null}" th:href="${c.sortHref}"
                 th:attr="hx-get=${c.sortHref},hx-target=|#${tableId}|,hx-select=|#${tableId}|,hx-include=|[type='search'], #${tableId}-filters input|"
                 hx-swap="outerHTML"
                 th:text="${c.label}">Column</a>
              <span th:if="${c.sortable == null}" th:text="${c.label}">Column</span>
            </th>
          </tr>
        </thead>
        <tbody class="hc-datagrid__body">
          <!-- With a declared key: the enclosing view model carries one anchor per row
               (docs/list-surface.md decision 2) — the id a `location: back` redirect's
               #row-… fragment refocuses. Views without a key render anonymous rows. -->
          <!-- A row a bulk report names is marked (docs/bulk-report.md decision 5):
               data-attention says what the row requires, aria-describedby points at its
               reason group in the report, and the retry set re-renders checked. -->
          <tr class="hc-datagrid__row" th:each="r, rStat : ${rows}"
              th:id="${v != null && v['anchors'] != null ? v['anchors'][rStat.index] : null}"
              th:attr="data-tombstone=${v != null && v['tombstones'] != null && v['tombstones'][rStat.index] == true} ? 'true' : null,data-attention=${v != null && v['attention'] != null && v['attention'][rStat.index] != null} ? 'error' : null,aria-describedby=${v != null && v['attention'] != null ? v['attention'][rStat.index] : null}"
              th:with="tombstone=${v != null && v['tombstones'] != null && v['tombstones'][rStat.index] == true}">
            <td class="hc-datagrid__cell"
                th:if="${v != null && v['selectable'] == true}">
              <input type="checkbox" class="hc-checkbox" name="ids" th:unless="${tombstone}"
                     th:value="${v['tokens'][rStat.index]}"
                     th:checked="${v['checked'] != null && v['checked'][rStat.index] == true}"
                     th:attr="aria-label=#{tql.view.select}">
            </td>
            <td class="hc-datagrid__cell" th:if="${v != null && v['numbers'] != null}"
                th:text="${v['numbers'][rStat.index]}">1</td>
            <!-- A snapshot row that vanished since the search (docs/list-surface.md decision
                 10): the page arithmetic and the user's count hold; only a new search drops
                 it from the membership. -->
            <td class="hc-datagrid__cell" th:if="${tombstone}"
                th:attr="colspan=${#lists.isEmpty(columns) ? 1 : #lists.size(columns)}"
                th:text="#{tql.view.tombstone}">No longer in this list.</td>
            <td class="hc-datagrid__cell" th:each="cell : ${r}" th:unless="${tombstone}">
              <a th:if="${cell.href != null}" th:href="@{${cell.href}}"
                 th:class="${cell.button} ? 'hc-button' : null"
                 th:attr="data-size=${cell.button} ? 'sm' : null"
                 th:text="${cell.text}">value</a>
              <span th:if="${cell.href == null}" th:text="${cell.text}">value</span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(rows)}">
            <td class="hc-datagrid__cell"
                th:attr="colspan=${(#lists.isEmpty(columns) ? 1 : #lists.size(columns)) + (v != null && v['selectable'] == true ? 1 : 0)}"
                th:text="#{tql.view.empty}">No rows</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>
</html>
