<!DOCTYPE html>
<!-- The framework form-view pattern (roadmap Phase 39, docs/declarative-views.md): renders a
     declarative `view: form` document through the blessed mutating-form recipe
     (docs/hypermedia-ui.md) — htmx post with inline field errors and a no-JS fallback. The `v`
     model shape and this file's markup are the public rendering contract; an app overrides the
     whole pattern by shipping templates/tql/view/form.html (customization ladder L2). -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: shell(${v.title}, ~{}, ~{}, ~{:: #page-content})}">
<div id="page-content" class="hc-stack">
<!-- The fragment anchors on the card, not the <form>, so an embedded form keeps its title,
     header slot, and notFound state (docs/view-composition.md wave 0). -->
<section class="hc-card" th:fragment="view(v)">
  <div class="hc-card__header">
    <h2 th:text="${v.title}">Form</h2>
    <span class="hc-spacer"></span>
    <th:block th:if="${v.slots['header'] != null}">
      <th:block th:insert="~{__${v.slots['header']}__}"/>
    </th:block>
  </div>
  <div class="hc-card__body hc-stack">
  <div class="hc-empty" th:if="${v.notFound}"><p class="hc-empty__title"
      th:text="#{tql.view.notFound}">Not found.</p></div>
  <form th:unless="${v.notFound}" th:id="${v.formId}" method="post" th:action="@{${v.action}}"
        th:attr="hx-post=@{${v.action}},hx-target=|#${v.formId}-errors|"
        hx-swap="innerHTML"
        hx-disabled-elt="find button[type=submit]" hx-indicator="find .hc-spinner">
    <input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf}">
    <!-- The one-time intent key (docs/idempotency-key.md decision 4): a route that declares
         idempotency: answers a replayed submit of this form instance with the original
         response; routes without the block ignore the field. -->
    <input type="hidden" name="_idempotency" th:if="${_idempotency != null}" th:value="${_idempotency}">
    <!-- The return target a list row link sent along (docs/list-surface.md decision 11):
         echoed so the command's `location: back` lands back on that list, same conditions,
         focused on the acting row. Rendered only when the renderer validated it app-local. -->
    <input type="hidden" name="_return" th:if="${_return != null}" th:value="${_return}">
    <div th:id="|${v.formId}-errors|"></div>
    <div class="hc-stack">
      <th:block th:each="f : ${v.fields}">
        <th:block th:replace="~{tql/view/field :: field(${f})}"/>
      </th:block>
      <span class="hc-action">
        <button type="submit" class="hc-button" data-variant="primary"
                th:text="#{tql.view.submit}">Save</button>
        <span class="hc-spinner htmx-indicator" aria-hidden="true"></span>
        <th:block th:if="${v.slots['actions'] != null}">
          <th:block th:insert="~{__${v.slots['actions']}__}"/>
        </th:block>
      </span>
    </div>
  </form>
  <th:block th:if="${v.slots['footer'] != null}">
    <th:block th:insert="~{__${v.slots['footer']}__}"/>
  </th:block>
  </div>
</section>
</div>
</html>
