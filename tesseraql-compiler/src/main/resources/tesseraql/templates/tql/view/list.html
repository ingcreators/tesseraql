<!DOCTYPE html>
<!-- The framework list-view pattern: the operational grid page (docs/list-surface.md, the
     flip). The chrome — title, presets, search bar, condition chips, status line, pager —
     stays put and only the grid scrolls (the .tql-list-page fill chain in tesseraql.css);
     page and sort links swap the table region in place and push the URL, the search box
     swaps it and replaces the URL, so every list state stays a bookmarkable address. The
     status line and pager live INSIDE the swapped region, so a search, sort or page swap
     updates them together with the rows; the chrome outside it that carries the list's state
     — the filter dialog's hidden sort/dir/search, the condition chips — is refreshed out of
     band by the same swaps (hx-select-oob on the section, inherited by every request inside
     it), so nothing a swap changes is left over from the page render. Regions render only when
     the contract declares them — a minimal list is still a quiet page. The `v` model shape
     and this markup are the public rendering contract; an app overrides the pattern by
     shipping templates/tql/view/list.html (customization ladder L2), or fills the
     header/footer slots (L1). -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: shell(${v.title}, ~{}, ~{}, ~{:: #page-content})}">
<div id="page-content" class="tql-page-fill hc-stack">
<section class="tql-list-page hc-stack" th:fragment="view(v)"
         th:attr="hx-select-oob=${v.filterFields != null} ? |#${v.id}-filters-state,#${v.id}-filterbar| : null">
  <div class="hc-cluster">
    <h2 th:text="${v.title}">List</h2>
    <!-- Named view presets (docs/list-surface.md decision 8): real links, no storage —
         the active one is marked, re-clicking it is the reset, and "Modified" says the
         current state goes beyond what the preset pins. -->
    <nav class="hc-cluster" th:if="${v.presets != null}"
         th:attr="aria-label=#{tql.view.presets}">
      <a th:each="p : ${v.presets}" class="hc-button" data-size="sm"
         th:href="${p.href}" th:text="${p.label}"
         th:attr="data-variant=${p.variant},aria-current=${p.current}">Open</a>
      <span class="hc-badge" data-variant="info" th:if="${v.presetModified}"
            th:text="#{tql.view.modified}">Modified</span>
    </nav>
    <span class="hc-spacer"></span>
    <th:block th:if="${v.slots['header'] != null}">
      <th:block th:insert="~{__${v.slots['header']}__}"/>
    </th:block>
  </div>
  <div class="hc-cluster"
       th:if="${v.search != null or v.filterFields != null or v.sortSet != null}">
    <input th:if="${v.search != null}" class="hc-input" type="search"
           th:id="|${v.id}-search|"
           th:name="${v.search.param}" th:value="${v.search.value}"
           th:placeholder="#{tql.view.search}"
           th:attr="hx-get=${v.path},hx-target=|#${v.id}-table|,hx-select=|#${v.id}-table|,hx-include=|#${v.id}-table input[type='hidden']|"
           hx-trigger="input changed delay:300ms, search" hx-swap="outerHTML"
           hx-replace-url="true">
    <button th:if="${v.filterFields != null}" type="button" class="hc-button"
            data-variant="ghost" command="show-modal" th:attr="commandfor=|${v.id}-filters|"
            th:text="#{tql.view.filters}">Filters</button>
    <span class="hc-chip" th:if="${v.sortSet != null}" th:text="${v.sortSet}">Sort (2)</span>
  </div>
  <!-- Applied conditions (docs/list-surface.md decision 6): each remove control is a real
       link to the same URL minus that condition, so dropping a filter works without
       JavaScript; the kit's filterbar collapses itself when nothing is applied. Named, because
       the remove links carry the search and sort of the render and a search or sort swap
       refreshes this bar out of band (the section's hx-select-oob). -->
  <div class="hc-filterbar" th:id="|${v.id}-filterbar|" th:if="${v.filterBar != null}">
    <ul class="hc-filterbar__list">
      <li class="hc-filterbar__item" th:each="chip : ${v.filterBar.chips}">
        <button class="hc-filterbar__chip" type="button" command="show-modal"
                th:attr="commandfor=|${v.id}-filters|">
          <span class="hc-filterbar__label" th:text="${chip.label}">Status</span>
          <span class="hc-filterbar__value" th:text="${chip.value}">open</span>
        </button>
        <a class="hc-filterbar__remove" th:href="${chip.removeHref}"
           th:attr="aria-label=${chip.removeLabel}">&times;</a>
      </li>
    </ul>
    <a class="hc-filterbar__clear" th:if="${not #lists.isEmpty(v.filterBar.chips)}"
       th:href="${v.filterBar.clearHref}" th:text="#{tql.view.clearFilters}">Clear all</a>
  </div>
  <!-- The export job region (docs/list-export.md decision 5): the running card an htmx kick-off
       answers swaps in here and then polls itself, stopping by rendering without a trigger.
       Outside the grid form, because the card carries its own Cancel form; outside the swapped
       table region, so a page, sort or search swap leaves a running card standing. Filled at
       render with the caller's exports of this list's routes that still need them — running,
       or done and not yet fetched (docs/job-inbox.md decision 8) — so a return to the page or a
       snapshot page turn finds the card; a kick-off adds its card above them. -->
  <div th:id="|${v.id}-export-job|" th:if="${v.exportForm}"><th:block th:if="${v.exportJobs != null}" th:each="c : ${v.exportJobs}"><th:block th:insert="~{tql/view/job-card :: card(${c})}"/></th:block></div>
  <!-- The export kick-off form (docs/list-export.md decision 3): the file-export controls in
       the strip below belong to it by `form=`, because the grid form wraps the region and a
       form cannot nest. It carries the framework's two fields and nothing else — the question
       travels in the control's own URL (decision 2), so nothing arrives twice and nothing the
       grid form carries (keys, ids, _return) reaches the export. -->
  <form th:id="|${v.id}-export|" method="post" th:if="${v.exportForm}">
    <input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf}">
    <input type="hidden" name="_idempotency" th:if="${_idempotency != null}"
           th:value="${_idempotency}">
  </form>
  <!-- One form wraps the selection bar and the grid (the datagrid-bulk-actions recipe):
       the checked rows' ids travel by native form serialization, each action button posts
       to its own route (formaction), and the no-JS submit answers post/redirect/get with
       `location: back` landing on this list. Without actions the form is inert chrome. It
       sits between the page and the grid region, so it carries the fill chain's class: a
       wrapper without one grows to its content, the page scrolls and the chrome scrolls away
       (the kit's .hc-fill warning; tesseraql.css). -->
  <form method="post" class="tql-list-page__form">
  <input type="hidden" name="_csrf"
         th:if="${_csrf != null && (v.actions != null or v.snapshot != null)}"
         th:value="${_csrf}">
  <input type="hidden" name="_return" th:if="${v.returnTo != null}" th:value="${v.returnTo}">
  <!-- The snapshot membership (docs/list-surface.md decision 10): every hit's row token,
       frozen at search time, outside the swapped region — the pager posts it back with the
       page number, and only a new search changes it. -->
  <th:block th:if="${v.snapshotKeys != null}">
    <input type="hidden" name="keys" th:each="k : ${v.snapshotKeys}" th:value="${k}">
  </th:block>
  <!-- The bulk report (docs/bulk-report.md): the outcome of the action this page just took,
       handed back through the redirect. The markup is the shared report pattern, filled here
       by the bulk feeder and by a reviewed import elsewhere (docs/csv-import.md decision 4);
       the row marks in the grid carry what the bounded groups left out. -->
  <th:block th:if="${v.report != null}">
    <th:block th:insert="~{tql/view/report :: report(${v.report})}"/>
  </th:block>
  <!-- The selection bar: hidden until rows are checked (installDatagridActions, auto-init);
       the count child carries the translated selected-count. -->
  <div class="hc-cluster" th:if="${v.actions != null}" hidden
       th:attr="data-hc-datagrid-actions=|#${v.id}-table|">
    <span data-hc-datagrid-count></span>
    <!-- On a snapshot list each action button carries the CURRENT page as its own submit
         value (docs/bulk-report.md decision 6): the bulk round trip's re-post then lands on
         the page the user acted from. A button value, not a hidden input — a hidden `page`
         would pair with the pager buttons' `page` and turn the scalar bind into a list. -->
    <button th:each="a : ${v.actions}" type="submit" class="hc-button" data-size="sm"
            th:formaction="@{${a.action}}" th:text="${a.label}"
            th:attr="data-hc-confirm=${a.confirm},data-hc-confirm-label=${a.confirm != null} ? ${a.label} : null,name=${v.snapshot != null && v.page != null && v.page['number'] != null} ? 'page' : null,value=${v.snapshot != null && v.page != null && v.page['number'] != null} ? ${v.page['number']} : null">Act</button>
  </div>
  <!-- With refreshOn: (docs/realtime.md) this region listens for the topic on the
       /_tesseraql/topics stream and re-GETs the page itself, selecting this same region —
       the SSE event carries no data. Empty values drop the attributes (plain list). -->
  <div th:id="|${v.id}-table|" class="tql-list-page__region hc-stack"
       th:attr="hx-ext=${v.liveExt},sse-connect=@{${v.liveConnect}},hx-get=${v.liveGet},hx-trigger=${v.liveTrigger},hx-select=${v.liveSelect},hx-include=${v.liveInclude},hx-target=${v.liveTarget},hx-swap=${v.liveSwap}">
    <input type="hidden" name="sort" th:if="${v.sort != ''}" th:value="${v.sort}">
    <input type="hidden" name="dir" th:if="${v.dir != ''}" th:value="${v.dir}">
    <!-- Applied filters ride the region's swaps the same way sort/dir do: the search box
         includes every hidden input here, and the sort links include this span by id. -->
    <span th:id="|${v.id}-table-filters|" hidden th:if="${v.filterFields != null}">
      <th:block th:each="f : ${v.filterFields}">
        <input type="hidden" th:if="${f.value != ''}" th:name="${f.name}" th:value="${f.value}">
      </th:block>
    </span>
    <!-- The result-cap surfaces (docs/hc-recipe-alignment.md): both render INSIDE the
         swapped region, so a narrowed search replaces them together with the rows. Mode B —
         a snapshot search over its cap — shows the reject block where the table would be;
         mode A — a warn-mode maxRows truncation — keeps the rows and adds the persistent
         banner plus the hedged "cap+" count. Over-cap is a user state: always HTTP 200. -->
    <div class="hc-empty" data-hc-result-cap role="status" th:if="${v.overCap != null}">
      <p class="hc-empty__title" th:text="${v.overCap['title']}">More than 500 rows match.</p>
      <p class="hc-empty__description" th:text="${v.overCap['body']}">Narrow the search.</p>
      <!-- The export is the way to take the over-cap set away (docs/list-export.md decision
           8): the reject block carries the control its own copy names. -->
      <div class="hc-empty__actions" th:if="${v.exports != null}">
        <th:block th:insert="~{tql/view/list :: exportControls(${v})}"/>
      </div>
    </div>
    <div class="hc-alert" data-variant="warning" role="status" data-hc-result-cap
         th:if="${v.truncated != null}">
      <p class="hc-alert__title" th:text="${v.truncated['title']}">Showing the first 500 rows.</p>
      <p class="hc-alert__body" th:text="${v.truncated['body']}">Narrow the filters.</p>
    </div>
    <div class="tql-list-page__grid" th:if="${v.overCap == null}">
      <th:block th:insert="~{tql/view/table :: table(|${v.id}-table|, ${v.columns}, ${v.rows})}"/>
    </div>
    <p class="tql-list-page__status" aria-live="polite" th:if="${v.truncated != null}"
       th:text="${v.truncated['count']}">500+ results</p>
    <div class="hc-cluster" th:if="${v.page != null or v.exports != null}">
      <p class="tql-list-page__status" aria-live="polite"
         th:if="${v.page != null and v.page['range'] != null}" th:text="${v.page['range']}">1–20 of 56</p>
      <!-- The export controls (docs/list-export.md decision 3) sit beside the count they
           carry, inside the swapped region, so a search, sort or page swap re-renders the
           question they ask together with the rows it describes. -->
      <th:block th:insert="~{tql/view/list :: exportControls(${v})}"/>
      <span class="hc-spacer"></span>
      <!-- The snapshot pager: POST buttons, because the membership travels in the body —
           snapshot pages have no URL and want none (reload is a new search, by design). -->
      <nav class="hc-pagination" aria-label="Pagination"
           th:if="${v.page != null and v.snapshot != null}">
        <button type="submit" class="hc-pagination__item" name="page"
                th:if="${v.page['hasPrev'] == true}" th:value="${v.page['number'] - 1}"
                th:text="#{tql.view.prev}">&lsaquo; Prev</button>
        <span th:if="${v.page['hasPrev'] != true}" class="hc-pagination__item"
              aria-disabled="true" th:text="#{tql.view.prev}">&lsaquo; Prev</span>
        <span class="hc-pagination__item" aria-current="page"
              th:text="|${v.page['number']} / ${v.page['totalPages']}|">1</span>
        <button type="submit" class="hc-pagination__item" name="page"
                th:if="${v.page['hasNext'] == true}" th:value="${v.page['number'] + 1}"
                th:text="#{tql.view.next}">Next &rsaquo;</button>
        <span th:if="${v.page['hasNext'] != true}" class="hc-pagination__item"
              aria-disabled="true" th:text="#{tql.view.next}">Next &rsaquo;</span>
      </nav>
      <nav class="hc-pagination" aria-label="Pagination"
           th:if="${v.page != null and v.snapshot == null}">
        <a th:if="${v.page['prevHref'] != null}" class="hc-pagination__item"
           th:href="${v.page['prevHref']}"
           th:attr="hx-get=${v.page['prevHref']},hx-target=|#${v.id}-table|,hx-select=|#${v.id}-table|"
           hx-swap="outerHTML" hx-push-url="true" th:text="#{tql.view.prev}">&lsaquo; Prev</a>
        <span th:if="${v.page['prevHref'] == null}" class="hc-pagination__item"
              aria-disabled="true" th:text="#{tql.view.prev}">&lsaquo; Prev</span>
        <span class="hc-pagination__item" aria-current="page"
              th:text="${v.page['totalPages'] != null}
                       ? |${v.page['number']} / ${v.page['totalPages']}|
                       : ${v.page['number']}">1</span>
        <a th:if="${v.page['nextHref'] != null}" class="hc-pagination__item"
           th:href="${v.page['nextHref']}"
           th:attr="hx-get=${v.page['nextHref']},hx-target=|#${v.id}-table|,hx-select=|#${v.id}-table|"
           hx-swap="outerHTML" hx-push-url="true" th:text="#{tql.view.next}">Next &rsaquo;</a>
        <span th:if="${v.page['nextHref'] == null}" class="hc-pagination__item"
              aria-disabled="true" th:text="#{tql.view.next}">Next &rsaquo;</span>
      </nav>
    </div>
  </div>
  </form>
  <th:block th:if="${v.slots['footer'] != null}">
    <th:block th:insert="~{__${v.slots['footer']}__}"/>
  </th:block>
  <!-- The filter dialog (docs/list-surface.md decision 6): one GET form of the declared
       filter inputs — applying navigates like any other search, so the result is a
       bookmarkable URL and page resets to 1. Cancel closes via the native dialog method. -->
  <dialog class="hc-dialog" th:id="|${v.id}-filters|" th:if="${v.filterFields != null}"
          th:attr="aria-labelledby=|${v.id}-filters-title|">
    <form method="get" th:action="${v.path}">
      <!-- The list state the dialog carries into its navigation — sort, dir, the search term —
           lives outside the swapped region, so a search or sort swap refreshes this block out of
           band (the section's hx-select-oob): Apply after a typed search or a sort click keeps
           them, instead of the page render's copies. -->
      <div th:id="|${v.id}-filters-state|" hidden>
        <input type="hidden" name="sort" th:if="${v.sort != ''}" th:value="${v.sort}">
        <input type="hidden" name="dir" th:if="${v.dir != ''}" th:value="${v.dir}">
        <input type="hidden" th:if="${v.search != null and v.search.value != ''}"
               th:name="${v.search.param}" th:value="${v.search.value}">
      </div>
      <div class="hc-dialog__header">
        <h2 class="hc-dialog__title" th:id="|${v.id}-filters-title|"
            th:text="#{tql.view.filters}">Filters</h2>
      </div>
      <div class="hc-dialog__body hc-stack">
        <th:block th:each="f : ${v.filterFields}">
          <th:block th:insert="~{tql/view/field :: field(${f})}"/>
        </th:block>
      </div>
      <div class="hc-dialog__footer">
        <button type="submit" class="hc-button" data-variant="ghost" formmethod="dialog"
                formnovalidate th:text="#{tql.view.cancel}">Cancel</button>
        <button type="submit" class="hc-button" data-variant="primary"
                th:text="#{tql.view.apply}">Apply</button>
      </div>
    </form>
  </dialog>
</section>
</div>
<!-- The export controls (docs/list-export.md decisions 1-3), one markup source for the strip
     and the reject block: a link for a query-export (the click downloads), a submit button of
     the kick-off form above for a file-export (the post starts the transfer). Each carries the
     list's current question — search, filters, sort — as the route's query string; the label
     names the count the list can vouch for. Outside #page-content, so the fragment renders
     only where it is inserted. -->
<th:block th:fragment="exportControls(v)">
  <th:block th:each="e : ${v.exports}">
    <a th:if="${e.method == 'GET'}" class="hc-button" data-variant="ghost" data-size="sm"
       th:href="@{${e.href}}" th:text="${e.label}">Export</a>
    <!-- The htmx face of the kick-off (docs/list-export.md decisions 3-5): the same URL,
         the kick-off form's two fields and nothing else (the enclosing grid form's values are
         collected by default and filtered out here), the answer added at the top of the job
         region — above the cards the region already holds (docs/job-inbox.md decision 8), so
         a second export joins the first instead of replacing it — the button disabled for the
         request. -->
    <button th:if="${e.method == 'POST'}" type="submit" class="hc-button" data-variant="ghost"
            data-size="sm" th:formaction="@{${e.href}}"
            th:attr="form=|${v.id}-export|,hx-post=@{${e.href}},hx-include=|#${v.id}-export|,hx-target=|#${v.id}-export-job|"
            hx-params="_csrf,_idempotency" hx-swap="afterbegin" hx-disabled-elt="this"
            th:text="${e.label}">Export</button>
  </th:block>
</th:block>
</html>
