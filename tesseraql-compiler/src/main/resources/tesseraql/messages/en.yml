# Framework built-in messages (roadmap Phase 22). Apps override any key in their own
# messages/<locale>.yml; texts may carry {name} placeholders interpolated from the
# field-error entry (constraint params, violation row columns).
tql:
  input:
    required: This field is required.
    min: "Must be at least {min}."
    max: "Must be at most {max}."
    maxLength: "Must be {maxLength} characters or fewer."
    enum: "Must be one of {options}."
    pattern: Does not match the required pattern.
    minLength: "Must be at least {minLength} characters."
    email: Not a valid email address.
    uuid: Not a valid UUID.
    url: Not a valid http(s) URL.
    page: Invalid page number.
    integer: Must be a whole number.
    number: Must be a number.
    date: Not a valid date.
    datetime: Not a valid date and time.
  constraint:
    duplicate: Already exists.
    invalid-reference: The referenced record does not exist.
    required: This field is required.
    invalid: Invalid value.
    constraint-violation: The change violates a data constraint.
  conflict:
    stale: >-
      The record may have been changed or deleted by another user; reload it and retry
      the operation.
  view:
    submit: Save
    empty: No rows
    prev: "\u2039 Prev"
    next: "Next \u203a"
    search: "Search…"
    range: "{from}–{to} of {total}"
    filters: Filters
    apply: Apply
    cancel: Cancel
    clearFilters: Clear all
    removeFilter: "Remove {label}"
    sortSet: "Sort ({count}): {list}"
    presets: Views
    modified: Modified
    select: Select row
    selectAll: Select all rows
    tombstone: No longer in this list.
    asOfSearch: "(as of search)"
    notFound: Not found.
    overCap: "More than {cap} rows match."
    overCapBody: "Narrow the search to at most {cap} rows, then work the list."
    truncated: "Showing the first {max} rows."
    truncatedBody: "More than {max} rows match. Narrow the search or filters to see the rest."
    truncatedSorted: "More than {max} rows match, sorted by {sort}. Narrow the search or filters to see the rest."
    truncatedCount: "{max}+ results"
  inbox:
    bell: Notifications
  lookup:
    unresolved: No match for this code.
    search: Search
    placeholder: Code or name
    more: "{cap}+ results — keep typing to narrow."
  workflow:
    actions: Actions
    notNow: Not available in this state.
    assigned: "Assigned to someone else — only the task holder may act."
    confirm: "This finishes the document's lifecycle. Continue?"
    stamped: "{done} of {total} stamped"
    comment: Comment
    commentRequired: "Required for: {transitions}"
  bulk:
    summary: "{succeeded} of {requested} succeeded; {failed} failed."
    allSucceeded: "All {requested} succeeded."
    row: "Row {number} — {key}"
    numberColumn: Row number
  report:
    more: "…and {count} more"
    moreReasons: "…and {count} more reason(s)"
  session:
    expiredTitle: Session expired
    expiredBody: Sign in again to continue. The action you started will complete after you sign in.
    login: Login
    password: Password
    otp: 6-digit code or a recovery code (if two-factor is enabled)
    signIn: Sign in
    cancel: Cancel
    oidc: Sign in with OIDC
    saml: Sign in with SAML
    invalid: Invalid credentials. Please try again.
    throttled: Too many attempts. Wait a few minutes and try again.
  http:
    "400": Bad Request
    "401": Unauthorized
    "403": Forbidden
    "404": Not Found
    "409": Conflict
    "422": Unprocessable Entity
    "429": Too Many Requests
    "500": Internal Server Error
    "503": Service Unavailable
