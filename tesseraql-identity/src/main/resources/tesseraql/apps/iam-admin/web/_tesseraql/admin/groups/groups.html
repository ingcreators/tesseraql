<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: page('IAM Admin · Groups', ~{:: #page-header}, ~{:: #page-content})}">
<th:block id="page-header">
  <span class="hc-spacer"></span>
  <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{/_tesseraql/admin/users}">Users</a>
  <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{/_tesseraql/admin/roles}">Roles</a>
</th:block>
<div id="page-content" class="hc-stack">
<p class="hc-alert" data-variant="success" role="status" th:if="${created != null}">Group created.</p>
<p class="hc-alert" data-variant="success" role="status" th:if="${deleted != null}">Group deleted.</p>
<div th:if="${available == 0}" class="hc-alert" data-variant="warning" role="status">
  <p class="hc-alert__title">Groups are unavailable for this realm.</p>
  <p th:text="${reason}">reason</p>
</div>
<section class="hc-card" th:if="${available == 1 and writable == 1}">
  <div class="hc-card__header">Create group</div>
  <div class="hc-card__body">
    <form method="post" th:action="@{/_tesseraql/admin/groups/create}" class="hc-cluster">
      <input type="hidden" name="_csrf" th:value="${_csrf}">
      <label class="hc-field"><span class="hc-field__label">Code</span>
        <input class="hc-input" name="code" required></label>
      <label class="hc-field"><span class="hc-field__label">Name</span>
        <input class="hc-input" name="name"></label>
      <button class="hc-button" data-variant="primary" type="submit">Create</button>
    </form>
  </div>
</section>
<section class="hc-card" th:if="${available == 1}">
  <div class="hc-card__header">Groups</div>
  <div class="hc-card__body">
    <div class="hc-empty" th:if="${#lists.isEmpty(rows)}">
      <p class="hc-empty__title">No groups.</p>
      <p class="hc-empty__description">A group is a bundle of roles with a membership. It is
        the way to give the same access to many people once.</p>
    </div>
    <div class="hc-table-scroll" th:if="${!#lists.isEmpty(rows)}">
      <table class="hc-table">
        <thead><tr><th>Code</th><th>Name</th><th>Members</th><th></th></tr></thead>
        <tbody>
          <tr th:each="g : ${rows}">
            <td><a th:href="@{'/_tesseraql/admin/groups/' + ${g.group_code}}"
                   th:text="${g.group_code}"></a></td>
            <td th:text="${g.group_name}"></td>
            <!-- The count honours the membership window, so a group whose members have
                 all aged out reads as empty rather than as full. -->
            <td th:text="${g.member_count}"></td>
            <td th:if="${writable == 1}">
              <form method="post" th:action="@{/_tesseraql/admin/groups/delete}">
                <input type="hidden" name="_csrf" th:value="${_csrf}">
                <input type="hidden" name="groupCode" th:value="${g.group_code}">
                <button class="hc-button" data-variant="ghost" data-size="sm" type="submit"
                        data-hc-confirm="Delete this group and every membership in it?">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</div>
</html>
