version: tesseraql/v1
id: tql.iamAdmin.users.unassignRole
kind: route
recipe: command-json

security:
  policy: tql.iam.admin.write

input:
  roleCode:
    type: string
    required: true

steps:
  - id: main
    service:
      name: iam.unassignRole
      params:
        userId: path.id
        roleCode: params.roleCode
response:
  redirect:
    location: /_tesseraql/admin/users/{path.id}?unassigned=1
