version: tesseraql/v1
id: tql.iamAdmin.applications.revokePermission
kind: route
recipe: command-json

security:
  policy: tql.iam.write.{path.name}

input:
  loginId:
    type: string
    required: true
  code:
    type: string
    required: true

steps:
  - id: main
    service:
      name: iam.app.revokePermission
      params:
        application: path.name
        actor: principal.loginId
        permissions: principal.permissions
        loginId: params.loginId
        code: params.code
response:
  redirect:
    location: /_tesseraql/admin/applications/{path.name}?revoked=1
