<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: page(#{tql.iam.page.accessReview}, ~{:: #page-header}, ~{:: #page-content})}">
<th:block id="page-header">
  <span class="hc-spacer"></span>
  <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{/_tesseraql/admin/reviews}" th:text="#{tql.iam.reviews}">Reviews</a>
</th:block>
<div id="page-content" class="hc-stack">
<p class="hc-alert" data-variant="success" role="status" th:if="${decided != null}" th:text="#{tql.iam.decisionRecorded}">Decision recorded.</p>
<div th:if="${available == 0}" class="hc-alert" data-variant="warning" role="status">
  <p class="hc-alert__title" th:text="#{tql.iam.accessReviewsAreUnavailable}">Access reviews are unavailable for this realm.</p>
  <p th:text="${reason}">reason</p>
</div>
<section class="hc-card" th:if="${available == 1 and review != null}">
  <div class="hc-card__header"><h1 th:text="${review.review_name}">review</h1></div>
  <div class="hc-card__body hc-stack">
    <p th:text="#{tql.iam.reviewMeta(${review.application != null ? review.application : #messages.msg('tql.iam.theWholeStore')}, ${review.opened_at}, ${review.opened_by}, ${review.status})}">meta</p>
    <!-- Closing executes every revoke decision through the same write an administrator
         uses, so each revocation is validated and recorded like any other. -->
    <form th:if="${open == 1 and writable == 1}" method="post"
          th:action="@{/_tesseraql/admin/reviews/{id}/close(id=${reviewId})}">
      <input type="hidden" name="_csrf" th:value="${_csrf}">
      <button class="hc-button" data-variant="primary" type="submit"
              th:data-hc-confirm="#{tql.iam.closeThisReviewAnd}" th:text="#{tql.iam.closeAndApply}">Close and apply</button>
    </form>
  </div>
</section>
<section class="hc-card" th:if="${available == 1}">
  <div class="hc-card__header" th:text="#{tql.iam.items}">Items</div>
  <div class="hc-card__body">
    <div class="hc-empty" th:if="${#lists.isEmpty(items)}">
      <p class="hc-empty__title" th:text="#{tql.iam.nothingWasInScope}">Nothing was in scope when this review opened.</p>
    </div>
    <div class="hc-table-scroll" th:if="${!#lists.isEmpty(items)}">
      <table class="hc-table">
        <thead><tr>
          <th th:text="#{tql.iam.user}">User</th><th th:text="#{tql.iam.kind}">Kind</th><th th:text="#{tql.iam.code}">Code</th><th th:text="#{tql.iam.arrivedBy}">Arrived by</th><th th:text="#{tql.iam.decision}">Decision</th>
          <th th:text="#{tql.iam.decidedBy}">Decided by</th><th></th>
        </tr></thead>
        <tbody>
          <tr th:each="i : ${items}">
            <td><a th:href="@{'/_tesseraql/admin/users/' + ${i.user_id}}"
                   th:text="${i.login_id != null ? i.login_id : i.user_id}"></a></td>
            <td th:text="${i.item_kind}"></td>
            <td><code th:text="${i.subject_code}"></code></td>
            <!-- The source is worth showing: a role that arrived from a rule or a group is
                 not something the person was individually given. -->
            <td th:text="${i.source}"></td>
            <td th:text="${i.decision}"></td>
            <td th:text="${i.decided_by != null ? i.decided_by : '—'}"></td>
            <td th:if="${open == 1 and writable == 1}">
              <form method="post"
                    th:action="@{/_tesseraql/admin/reviews/{id}/decide(id=${reviewId})}" class="hc-cluster">
                <input type="hidden" name="_csrf" th:value="${_csrf}">
                <input type="hidden" name="userId" th:value="${i.user_id}">
                <input type="hidden" name="itemKind" th:value="${i.item_kind}">
                <input type="hidden" name="subjectCode" th:value="${i.subject_code}">
                <select class="hc-input" data-size="sm" name="decision">
                  <option value="keep" th:text="#{tql.iam.keep}">keep</option>
                  <option value="revoke" th:text="#{tql.iam.revoke2}">revoke</option>
                </select>
                <input class="hc-input" data-size="sm" name="note" th:placeholder="#{tql.iam.note}">
                <button class="hc-button" data-variant="ghost" data-size="sm" type="submit" th:text="#{tql.iam.record}">Record</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</div>
</html>
