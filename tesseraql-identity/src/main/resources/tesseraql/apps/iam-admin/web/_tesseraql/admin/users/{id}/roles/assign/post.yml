version: tesseraql/v1
id: tql.iamAdmin.users.assignRole
kind: route
recipe: command-json

security:
  policy: tql.iam.admin.write

input:
  roleCode:
    type: string
    required: true
  startsAt:
    type: string
    required: false
  endsAt:
    type: string
    required: false

steps:
  - id: main
    service:
      name: iam.assignRole
      params:
        # Who decided, for the grant trail (docs/access-governance.md structural
        # decision 1): route-resolved from the session principal, never caller-writable.
        actor: principal.loginId
        userId: path.id
        roleCode: params.roleCode
        startsAt: params.startsAt
        endsAt: params.endsAt
response:
  redirect:
    location: /_tesseraql/admin/users/{path.id}?assigned=1
