version: tesseraql/v1
id: tql.iamAdmin.sessions
kind: route
recipe: query-html

# The cross-subject sessions view (docs/session-visibility.md): who holds live sessions,
# on what device, since when - each subject linking to its user page, each row endable.
security:
  policy: iam.admin.view

input:
  q:
    type: string
    required: false
  signedout:
    type: string
    required: false

sources:
  main:
    service:
      name: iam.sessions
      params:
        q: params.q
response:
  html:
    status: 200
    template: sessions.html
    model:
      sessions: main
      signedout: params.signedout
