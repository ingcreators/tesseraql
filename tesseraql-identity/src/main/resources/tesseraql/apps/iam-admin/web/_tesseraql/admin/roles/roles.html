<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tql/shell :: page(#{tql.iam.page.roles}, ~{:: #page-header}, ~{:: #page-content})}">
<th:block id="page-header">
  <span class="hc-spacer"></span>
  <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{/_tesseraql/admin/users}" th:text="#{tql.iam.users}">Users</a>
  <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{/_tesseraql/admin/applications}" th:text="#{tql.iam.applications}">Applications</a>
  <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{/_tesseraql/admin/rules}" th:text="#{tql.iam.rules}">Rules</a>
  <a class="hc-button" data-variant="ghost" data-size="sm" th:href="@{/_tesseraql/admin/conditions}" th:text="#{tql.iam.conditions}">Conditions</a>
</th:block>
<div id="page-content" class="hc-stack">
<p class="hc-alert" data-variant="success" role="status" th:if="${created != null}" th:text="#{tql.iam.roleCreated}">Role created.</p>
<div th:if="${available == 0}" class="hc-alert" data-variant="warning" role="status">
  <p class="hc-alert__title" th:text="#{tql.iam.roleManagementIsUnavailable}">Role management is unavailable for this realm.</p>
  <p th:text="${reason}">reason</p>
</div>
<section class="hc-card" th:if="${available == 1 and writable == 1}">
  <div class="hc-card__header" th:text="#{tql.iam.createRole}">Create role</div>
  <div class="hc-card__body hc-stack">
    <!-- An application role's code carries its application's name as its first segment;
         a blank application makes a stack-wide role (docs/application-roles.md). -->
    <form method="post" th:action="@{/_tesseraql/admin/roles/create}" class="hc-cluster">
      <input type="hidden" name="_csrf" th:value="${_csrf}">
      <label class="hc-field">
        <span class="hc-field__label" th:text="#{tql.iam.code}">Code</span>
        <input class="hc-input" name="code" required>
      </label>
      <label class="hc-field">
        <span class="hc-field__label" th:text="#{tql.iam.name}">Name</span>
        <input class="hc-input" name="name">
      </label>
      <label class="hc-field">
        <span class="hc-field__label" th:text="#{tql.iam.applicationBlankStackWide}">Application (blank = stack-wide)</span>
        <select class="hc-input" name="application">
          <option value=""></option>
          <option th:each="m : ${members}" th:value="${m}" th:text="${m}"></option>
        </select>
      </label>
      <button class="hc-button" data-variant="primary" type="submit" th:text="#{tql.iam.create}">Create</button>
    </form>
  </div>
</section>
<section class="hc-card">
  <div class="hc-card__header" th:text="#{tql.iam.roles}">Roles</div>
  <div class="hc-card__body hc-stack">
    <div class="hc-empty" th:if="${#lists.isEmpty(rows)}">
      <p class="hc-empty__title" th:text="#{tql.iam.noRolesInThe}">No roles in the store.</p>
    </div>
    <div class="hc-table-scroll" th:if="${!#lists.isEmpty(rows)}">
      <table class="hc-table">
        <thead><tr><th th:text="#{tql.iam.code}">Code</th><th th:text="#{tql.iam.name}">Name</th><th th:text="#{tql.iam.application}">Application</th><th th:text="#{tql.iam.source}">Source</th></tr></thead>
        <tbody>
          <tr th:each="r : ${rows}">
            <td><code th:text="${r.role_code}"></code></td>
            <td th:text="${r.role_name}"></td>
            <td th:text="${r.application != null ? r.application : 'stack-wide'}"></td>
            <td>
              <span th:text="${r.source}">admin</span>
              <!-- Report-only (docs/application-roles.md open question 5): the declaration
                   went away; assignments are kept and re-declaring revives the role. -->
              <span class="hc-badge" th:if="${r.source == 'orphaned'}" th:text="#{tql.iam.noLongerDeclared}">no longer declared</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</div>
</html>
