version: tesseraql/v1
id: tql.iamAdmin.groups.addMember
kind: route
recipe: command-json

security:
  policy: tql.iam.admin.write

input:
  userId:
    type: string
    required: true
  startsAt:
    type: string
    required: false
  endsAt:
    type: string
    required: false

steps:
  - id: main
    service:
      name: iam.addGroupMember
      params:
        actor: principal.loginId
        groupCode: path.code
        userId: params.userId
        startsAt: params.startsAt
        endsAt: params.endsAt
response:
  redirect:
    location: /_tesseraql/admin/groups/{path.code}?added=1
