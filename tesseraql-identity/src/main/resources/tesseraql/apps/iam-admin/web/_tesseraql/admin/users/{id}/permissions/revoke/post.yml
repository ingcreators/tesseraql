version: tesseraql/v1
id: tql.iamAdmin.users.revokePermission
kind: route
recipe: command-json

security:
  policy: tql.iam.admin.write

input:
  code:
    type: string
    required: true

steps:
  - id: main
    service:
      name: iam.revokePermission
      params:
        actor: principal.loginId
        userId: path.id
        code: params.code
response:
  redirect:
    location: /_tesseraql/admin/users/{path.id}?revoked=1
