version: tesseraql/v1
id: tql.iamAdmin.applications.assignRole
kind: route
recipe: command-json

security:
  policy: tql.iam.write.{path.name}

input:
  loginId:
    type: string
    required: true
  roleCode:
    type: string
    required: true
  startsAt:
    type: string
    required: false
  endsAt:
    type: string
    required: false

steps:
  - id: main
    service:
      name: iam.app.assignRole
      params:
        application: path.name
        # Who decided, for the grant trail (docs/access-governance.md structural
        # decision 1): route-resolved from the session principal, never caller-writable.
        actor: principal.loginId
        permissions: principal.permissions
        # The user is named by the login the administrator was given: an administrator
        # confined to one application has no business enumerating the store to find one.
        loginId: params.loginId
        roleCode: params.roleCode
        startsAt: params.startsAt
        endsAt: params.endsAt
response:
  redirect:
    location: /_tesseraql/admin/applications/{path.name}?assigned=1
