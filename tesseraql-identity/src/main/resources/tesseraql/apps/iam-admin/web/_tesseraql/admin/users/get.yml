version: tesseraql/v1
id: tql.iamAdmin.users.list
kind: route
recipe: query-html

security:
  policy: iam.admin.view

input:
  invited:
    type: string
    required: false
  bulk:
    type: string
    required: false
  selected:
    type: string
    required: false
  q:
    type: string
    required: false

sql:
  contract: identity.list-users
  params:
    q: params.q

queries:
  total:
    contract: identity.count-users

response:
  html:
    status: 200
    template: list.html
    model:
      users: sql.rows
      total: total.rows
      invited: params.invited
      bulk: params.bulk
      selected: params.selected
      q: params.q
