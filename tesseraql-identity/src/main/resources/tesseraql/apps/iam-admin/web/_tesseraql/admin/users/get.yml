version: tesseraql/v1
id: tql.iamAdmin.users.list
kind: route
recipe: query-html

security:
  policy: tql.iam.admin.view

input:
  invited:
    type: string
    required: false
  bulk:
    type: string
    required: false
  selected:
    type: string
    required: false
  q:
    type: string
    required: false

sources:
  main:
    contract:
      name: identity.list-users
      params:
        q: params.q
  total:
    contract:
      name: identity.count-users
response:
  html:
    status: 200
    template: list.html
    model:
      users: main.rows
      total: total.rows
      invited: params.invited
      bulk: params.bulk
      selected: params.selected
      q: params.q
