version: tesseraql/v1
id: tql.iamAdmin.users.detail
kind: route
recipe: query-html

security:
  policy: tql.iam.admin.view

# The post/redirect/get flash flags: each action lands back here naming what it did, and
# the page confirms it (docs/console-ux-refresh.md slice 2).
input:
  enabled:
    type: string
    required: false
  disabled:
    type: string
    required: false
  signedout:
    type: string
    required: false
  assigned:
    type: string
    required: false
  unassigned:
    type: string
    required: false
  granted:
    type: string
    required: false
  revoked:
    type: string
    required: false
  attrset:
    type: string
    required: false
  attrdeleted:
    type: string
    required: false
  recomputed:
    type: string
    required: false

sources:
  main:
    contract:
      name: identity.find-user-by-id
      params:
        userId: path.id
  roles:
    contract:
      name: identity.find-roles-by-user-id
      params:
        userId: path.id
  groups:
    contract:
      name: identity.find-groups-by-user-id
      params:
        userId: path.id
  permissions:
    contract:
      name: identity.find-permissions-by-user-id
      params:
        userId: path.id
  sessions:
    service:
      name: iam.userSessions
      params:
        userId: path.id
  editor:
    service:
      name: iam.grantEditor
      params:
        userId: path.id
  history:
    service:
      name: iam.grantHistory
      params:
        userId: path.id
response:
  html:
    status: 200
    template: detail.html
    model:
      user: main.rows
      roles: roles.rows
      groups: groups.rows
      permissions: permissions.rows
      sessions: sessions.rows
      sessionCount: sessions.count
      enabled: params.enabled
      disabled: params.disabled
      signedout: params.signedout
      assigned: params.assigned
      unassigned: params.unassigned
      granted: params.granted
      revoked: params.revoked
      assignments: editor.assignments
      attributes: editor.attributes
      attrset: params.attrset
      attrdeleted: params.attrdeleted
      recomputed: params.recomputed
      grants: editor.grants
      allRoles: editor.roles
      editorAvailable: editor.available
      editorWritable: editor.writable
      history: history.rows
      historyAvailable: history.available
