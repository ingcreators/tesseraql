version: tesseraql/v1
id: tql.iamAdmin.users.grantPermission
kind: route
recipe: command-json

security:
  policy: tql.iam.admin.write

input:
  code:
    type: string
    required: true
  startsAt:
    type: string
    required: false
  endsAt:
    type: string
    required: false

steps:
  - id: main
    service:
      name: iam.grantPermission
      params:
        userId: path.id
        code: params.code
        startsAt: params.startsAt
        endsAt: params.endsAt
response:
  redirect:
    location: /_tesseraql/admin/users/{path.id}?granted=1
