version: tesseraql/v1
id: tql.iamAdmin.users.enable
kind: route
recipe: command-json

security:
  policy: iam.admin.write

steps:
  - id: main
    contract:
      name: identity.enable-user
      mode: update
      params:
        userId: path.id
response:
  redirect:
    location: /_tesseraql/admin/users/{path.id}?enabled=1
